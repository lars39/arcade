<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><script id="arcade-esc-menu">(function(){
  if (window.__arcadeEsc) return; window.__arcadeEsc = true;
  var paused = false, pausedAt = 0, offset = 0;
  var realNow = performance.now.bind(performance);
  performance.now = function(){ return (paused ? pausedAt : realNow()) - offset; };
  var realRaf = window.requestAnimationFrame.bind(window), realCaf = window.cancelAnimationFrame.bind(window);
  var jobs = new Map(), nextId = 1;
  window.requestAnimationFrame = function(cb){
    var id = nextId++;
    var run = function(){
      if (!jobs.has(id)) return;
      if (paused) { jobs.set(id, realRaf(run)); return; }
      jobs.delete(id); cb(performance.now());
    };
    jobs.set(id, realRaf(run));
    return id;
  };
  window.cancelAnimationFrame = function(id){ if (jobs.has(id)) { realCaf(jobs.get(id)); jobs.delete(id); } };
  var ctxs = [];
  ['AudioContext','webkitAudioContext'].forEach(function(n){
    var C = window[n]; if (!C) return;
    var W = function(a,b){ var c = new C(a,b); ctxs.push(c); return c; };
    W.prototype = C.prototype; try { Object.setPrototypeOf(W, C); } catch(e){}
    window[n] = W;
  });
  var held = {};
  var box = null, keepBtn = null;
  function build(){
    box = document.createElement('div');
    box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','Game paused');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:rgba(8,6,16,.6);font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif';
    box.innerHTML = '<div style="background:#1b1630;border:1px solid #463a7a;border-radius:14px;padding:22px 22px 18px;min-width:240px;max-width:86vw;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.6);color:#f2eeff">' +
      '<div style="font-family:inherit;font-weight:700;font-size:13px;line-height:1;letter-spacing:2px;color:#a79fcb;margin-bottom:14px">GAME PAUSED</div>' +
      '<button data-a="keep" style="display:block;width:100%;margin:0 0 10px;padding:12px 16px;border:0;border-radius:10px;background:#ffd23f;color:#16101f;font-family:inherit;font-weight:700;font-size:17px;cursor:pointer">Keep playing</button>' +
      '<button data-a="leave" style="display:block;width:100%;margin:0;padding:12px 16px;border:1px solid #463a7a;border-radius:10px;background:#251e42;color:#f2eeff;font-family:inherit;font-weight:700;font-size:17px;cursor:pointer">Leave game</button></div>';
    var stop = function(e){ e.stopPropagation(); };
    ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click','wheel','contextmenu'].forEach(function(t){ box.addEventListener(t, stop); });
    box.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('button'); if (!b) return;
      if (b.dataset.a === 'keep') close(); else leave();
    });
    keepBtn = box.querySelector('[data-a=keep]');
    var st = document.createElement('style');
    st.textContent = '[data-a]:focus-visible{outline:3px solid #4dd8ff;outline-offset:2px}';
    box.appendChild(st);
  }
  function fireKeyup(code, key){
    [window, document].forEach(function(t){
      try { t.dispatchEvent(new KeyboardEvent('keyup', {key:key, code:code, bubbles:true})); } catch(e){}
    });
  }
  function open(){
    if (paused) return;
    for (var c in held) fireKeyup(c, held[c]);
    held = {};
    pausedAt = realNow(); paused = true;
    ctxs.forEach(function(c){ if (c.state === 'running') { c.__escSusp = true; c.suspend(); } });
    if (!box) build();
    (document.body || document.documentElement).appendChild(box);
    keepBtn.focus();
  }
  function close(){
    if (!paused) return;
    offset += realNow() - pausedAt; paused = false;
    if (box && box.parentNode) box.parentNode.removeChild(box);
    ctxs.forEach(function(c){ if (c.__escSusp) { c.__escSusp = false; c.resume(); } });
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    try { window.focus(); } catch(e){}
  }
  function leave(){ location.href = '../'; }
  function onKey(e){
    if (e.key === 'Escape' || e.code === 'Escape') {
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.type === 'keydown' && !e.repeat) { paused ? close() : open(); }
      return;
    }
    if (paused) {
      var k = e.key;
      if (e.type === 'keydown' && (k === 'Tab' || k === 'Enter' || k === ' ' || k.indexOf('Arrow') === 0)) {
        var bs = box.querySelectorAll('button');
        if (k.indexOf('Arrow') === 0 || k === 'Tab') {
          e.preventDefault();
          (document.activeElement === bs[0] ? bs[1] : bs[0]).focus();
        } else if (document.activeElement && document.activeElement.click && box.contains(document.activeElement)) {
          e.preventDefault(); document.activeElement.click();
        }
      }
      e.stopImmediatePropagation();
      return;
    }
    if (e.isTrusted) {
      if (e.type === 'keydown') held[e.code] = e.key; else delete held[e.code];
    }
  }
  window.addEventListener('keydown', onKey, true);
  window.addEventListener('keyup', onKey, true);
  window.addEventListener('keypress', function(e){ if (paused || e.key === 'Escape') e.stopImmediatePropagation(); }, true);
})();
</script><script id="arcade-presence">(function(){
  if (window.__arcadePresence) return; window.__arcadePresence = {};
  var pid;
  try { pid = localStorage.getItem('arcade_pid'); } catch(e){}
  if (!pid || !/^[a-z0-9]{8,32}$/.test(pid)) {
    pid = ''; while (pid.length < 16) pid += Math.random().toString(36).slice(2);
    pid = pid.slice(0, 16);
    try { localStorage.setItem('arcade_pid', pid); } catch(e){}
  }
  var home = !!document.querySelector && location.pathname.replace(/index\.html$/,'') === '/';
  var every = home ? 30000 : 60000, last = 0;
  function beat(){
    if (document.hidden) return;
    last = Date.now();
    try {
      fetch('/api/presence', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({pid:pid}), keepalive:true})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ if (d && typeof d.now === 'number') { window.__arcadePresence = d; try { window.dispatchEvent(new CustomEvent('arcade-presence', {detail:d})); } catch(e){} } })
        .catch(function(){});
    } catch(e){}
  }
  setInterval(beat, every);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && Date.now() - last > 15000) beat(); });
  beat();
})();

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHARD SLICER</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0716;touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;display:block;image-rendering:auto}</style></head>
<body><canvas id="c"></canvas>
<script>
/* ===== Shared micro-engine (inlined into each game at build time) =====
   Logical resolution 960x540, letterboxed. Handles: (no platform SDK,
   loaded async with offline fallback), input (keys/mouse/touch + virtual
   buttons), procedural audio, juice (shake/particles/flash/hitstop/popups),
   title/pause/gameover flow, best-score storage. */
(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.Engine = { W, H, t: 0, state: 'boot' });

  /* ---------- storage ---------- */
  // Progress (best scores, unlocked levels, mute) is saved in the browser's localStorage.
  E.load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  E.save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  /* ---------- math helpers ---------- */
  E.rand = (a, b) => a + Math.random() * (b - a);
  E.randi = (a, b) => Math.floor(E.rand(a, b + 1));
  E.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  E.lerp = (a, b, t) => a + (b - a) * t;
  E.pick = (arr) => arr[(Math.random() * arr.length) | 0];
  E.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  E.aabb = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  /* ---------- game-flow hooks (no platform SDK; kept so game code can call them) ---------- */
  const SDK = (E.sdk = { start() {}, stop() {}, happy() {}, midgame(cb) { cb && cb(); } });

  /* ---------- canvas ---------- */
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  E.ctx = ctx; E.canvas = canvas;
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    offX = (vw - cw) / 2; offY = (vh - ch) / 2;
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    canvas.style.left = offX + 'px'; canvas.style.top = offY + 'px';
    canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(ch * dpr);
  }
  window.addEventListener('resize', resize); resize();

  /* ---------- input ---------- */
  const keys = {}, pressed = {}, uiPressed = {};
  E.uiHit = (...ks) => ks.some((k) => uiPressed[k]);
  E.press = (k) => { pressed[k] = true; }; // used by automated tests
  E.clearPressed = () => { for (const k in pressed) delete pressed[k]; };
  E.inUI = (x, y) => y < 56 && x > W - 110;
  E.keys = keys;
  E.down = (...ks) => ks.some((k) => keys[k]);
  E.hit = (...ks) => ks.some((k) => pressed[k]);
  const BLOCK = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  window.addEventListener('keydown', (e) => {
    if (BLOCK.includes(e.code)) e.preventDefault();
    Audio.unlock(); E.touchMode = false;
    if (!keys[e.code]) { pressed[e.code] = true; uiPressed[e.code] = true; }
    keys[e.code] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (E.state === 'play') E.pause(true); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && E.state === 'play') E.pause(true); });

  const ptr = (E.pointer = { x: W / 2, y: H / 2, down: false, clicked: false, released: false });
  const toLogical = (cx, cy) => [(cx - offX) / scale, (cy - offY) / scale];
  E.touchButtons = []; // {key,label,x,y,r}
  const activeTouches = new Map(); // id -> key | 'ptr'
  function btnAt(x, y) {
    for (const b of E.touchButtons) if ((x - b.x) ** 2 + (y - b.y) ** 2 < (b.r * 1.25) ** 2) return b;
    return null;
  }
  canvas.addEventListener('mousedown', (e) => {
    Audio.unlock(); E.touchMode = false;
    [ptr.x, ptr.y] = toLogical(e.clientX, e.clientY);
    ptr.down = true; ptr.clicked = true; ptr.uiClick = true; ptr.button = e.button;
  });
  window.addEventListener('mousemove', (e) => { [ptr.x, ptr.y] = toLogical(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (ptr.down) ptr.released = true; ptr.down = false; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  function tstart(e) {
    e.preventDefault(); Audio.unlock(); E.touchMode = true;
    for (const t of e.changedTouches) {
      const [x, y] = toLogical(t.clientX, t.clientY);
      const b = E.state === 'play' ? btnAt(x, y) : null;
      if (b) { activeTouches.set(t.identifier, b.key); if (!keys[b.key]) { pressed[b.key] = true; uiPressed[b.key] = true; } keys[b.key] = true; }
      else { activeTouches.set(t.identifier, 'ptr'); ptr.x = x; ptr.y = y; ptr.down = true; ptr.clicked = true; ptr.uiClick = true; }
    }
  }
  function tmove(e) {
    e.preventDefault();
    for (const t of e.changedTouches) if (activeTouches.get(t.identifier) === 'ptr') [ptr.x, ptr.y] = toLogical(t.clientX, t.clientY);
  }
  function tend(e) {
    e.preventDefault(); Audio.unlock();
    for (const t of e.changedTouches) {
      const k = activeTouches.get(t.identifier);
      activeTouches.delete(t.identifier);
      if (k === 'ptr') { if (![...activeTouches.values()].includes('ptr')) { ptr.down = false; ptr.released = true; } }
      else if (k && ![...activeTouches.values()].includes(k)) keys[k] = false;
    }
  }
  canvas.addEventListener('touchstart', tstart, { passive: false });
  canvas.addEventListener('touchmove', tmove, { passive: false });
  canvas.addEventListener('touchend', tend, { passive: false });
  canvas.addEventListener('touchcancel', tend, { passive: false });
  E.touchMode = 'ontouchstart' in window && navigator.maxTouchPoints > 0 && !matchMedia('(pointer:fine)').matches;

  /* ---------- audio (procedural) ---------- */
  const Audio = (E.audio = { ctx: null, master: null, userMuted: E.load('mute_' + document.title, false) });
  Audio.unlock = function () {
    try {
      if (!Audio.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        Audio.ctx = new AC(); Audio.master = Audio.ctx.createGain(); Audio.master.connect(Audio.ctx.destination);
        Audio.apply();
      }
      if (Audio.ctx.state === 'suspended') Audio.ctx.resume();
    } catch (e) {}
  };
  Audio.isMuted = () => Audio.userMuted;
  Audio.apply = () => { if (Audio.master) Audio.master.gain.value = Audio.isMuted() ? 0 : 0.5; };
  Audio.toggle = () => { Audio.userMuted = !Audio.userMuted; E.save('mute_' + document.title, Audio.userMuted); Audio.apply(); };
  /* tone(freq, dur, type, vol, slideTo, delay) */
  E.tone = function (f, d = 0.1, type = 'square', v = 0.2, slide = 0, delay = 0) {
    const a = Audio.ctx; if (!a || Audio.isMuted()) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(Audio.master); o.start(t0); o.stop(t0 + d + 0.02);
  };
  let noiseBuf = null;
  E.noise = function (d = 0.2, v = 0.3, freq = 1200, delay = 0) {
    const a = Audio.ctx; if (!a || Audio.isMuted()) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
    const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    s.connect(f); f.connect(g); g.connect(Audio.master); s.start(t0); s.stop(t0 + d + 0.05);
  };
  /* simple generative music: scale + bass, scheduled ahead */
  const Music = (E.music = { on: false, step: 0, next: 0, bpm: 120, scale: [0, 3, 5, 7, 10], root: 220, pattern: null });
  Music.start = (opts) => { Object.assign(Music, opts || {}); Music.on = true; Music.step = 0; Music.next = Audio.ctx ? Audio.ctx.currentTime + 0.05 : 0; };
  Music.stop = () => { Music.on = false; };
  function musicTick() {
    const a = Audio.ctx; if (!a || !Music.on || Audio.isMuted()) { if (a) Music.next = a.currentTime + 0.05; return; }
    const spb = 60 / Music.bpm / 2;
    while (Music.next < a.currentTime + 0.15) {
      const s = Music.step, t = Music.next - a.currentTime;
      const deg = Music.pattern ? Music.pattern[s % Music.pattern.length] : null;
      if (deg != null && deg >= 0) { const n = Music.scale[deg % Music.scale.length] + 12 * Math.floor(deg / Music.scale.length); E.tone(Music.root * Math.pow(2, n / 12), spb * 0.9, 'triangle', 0.05, 0, t); }
      if (s % 8 === 0) E.tone(Music.root / 2, spb * 3, 'sine', 0.09, 0, t);
      if (s % 8 === 4) E.tone(Music.root / 2 * Math.pow(2, Music.scale[3] / 12), spb * 3, 'sine', 0.07, 0, t);
      if (s % 4 === 2) E.noise(0.04, 0.04, 6000, t);
      Music.step++; Music.next += spb;
    }
  }

  /* ---------- juice ---------- */
  let shakeAmt = 0, flashA = 0, flashC = '#fff', hitstop = 0;
  E.shake = (a) => { shakeAmt = Math.max(shakeAmt, a); };
  E.flash = (c = '#fff', a = 0.5) => { flashC = c; flashA = a; };
  E.hitstop = (s) => { hitstop = Math.max(hitstop, s); };
  const parts = (E.particles = []);
  E.burst = function (x, y, n, color, spd = 4, life = 30, size = 3, grav = 0.1) {
    for (let i = 0; i < n && parts.length < 900; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, size: size * (0.5 + Math.random()), grav });
    }
  };
  E.spark = (x, y, vx, vy, color, life = 20, size = 3, grav = 0) => { if (parts.length < 900) parts.push({ x, y, vx, vy, life, max: life, color, size, grav }); };
  const popups = [];
  E.popup = (x, y, text, color = '#fff', size = 22) => popups.push({ x, y, text, color, size, life: 50 });
  function updateFx() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.98; p.life--;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 0.8; if (--p.life <= 0) popups.splice(i, 1); }
    shakeAmt *= 0.88; if (shakeAmt < 0.2) shakeAmt = 0; flashA *= 0.9;
  }
  E.drawParticles = function (c, camX = 0, camY = 0) {
    for (const p of parts) {
      c.globalAlpha = Math.max(0, p.life / p.max); c.fillStyle = p.color;
      const s = p.size * (0.4 + 0.6 * p.life / p.max);
      c.fillRect(p.x - camX - s / 2, p.y - camY - s / 2, s, s);
    }
    c.globalAlpha = 1;
  };
  E.drawPopups = function (c, camX = 0, camY = 0) {
    for (const p of popups) { c.globalAlpha = Math.min(1, p.life / 20); E.text(p.text, p.x - camX, p.y - camY, p.size, p.color); }
    c.globalAlpha = 1;
  };
  E.clearFx = () => { parts.length = 0; popups.length = 0; };

  /* ---------- text / ui ---------- */
  E.font = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  E.text = function (s, x, y, size = 24, color = '#fff', align = 'center', outline = true) {
    size = Math.max(size, 13); // stays readable on small screens
    ctx.font = `bold ${size}px ${E.font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(s, x, y); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  };
  let buttons = [];
  E.button = function (label, x, y, w, h, onClick, color = '#ffffff') {
    const hov = ptr.x > x - w / 2 && ptr.x < x + w / 2 && ptr.y > y - h / 2 && ptr.y < y + h / 2;
    ctx.fillStyle = hov ? color : 'rgba(0,0,0,0.45)';
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    roundRect(x - w / 2, y - h / 2, w, h, 12); ctx.fill(); ctx.stroke();
    E.text(label, x, y + 1, Math.min(28, h * 0.5), hov ? '#111' : color, 'center', !hov);
    buttons.push({ x: x - w / 2, y: y - h / 2, w, h, onClick });
  };
  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  E.roundRect = roundRect;

  /* ---------- game flow ---------- */
  let G = null; // game definition
  E.best = 0; E.score = 0; E.lastStats = null; E.newBest = false;
  E.pause = (auto) => { if (E.state !== 'play') return; for (const k in uiPressed) delete uiPressed[k]; E.state = 'pause'; if (auto !== true) SDK.stop(); Music.stop(); };
  E.resume = () => { if (E.state !== 'pause') return; E.state = 'play'; SDK.start(); G.music && Music.start(G.music); };
  E.startRun = function () {
    E.clearFx(); E.score = 0; E.newBest = false;
    G.start && G.start();
    E.state = 'play'; SDK.start();
    G.music && Music.start(G.music);
  };
  E.gameOver = function (score, stats) {
    if (E.state !== 'play') return;
    E.score = Math.floor(score); E.lastStats = stats || null;
    if (E.score > E.best) { E.best = E.score; E.save(G.id + '_best', E.best); E.newBest = E.score > 0; if (E.newBest) SDK.happy(); }
    E.state = 'over'; E.overT = 0; SDK.stop(); Music.stop();
  };
  E.toTitle = () => { E.state = 'title'; SDK.stop(); Music.stop(); };
  /* restart goes through midgame ad (only between runs) */
  E.retry = () => { E.state = 'ad'; SDK.midgame(() => E.startRun()); };

  function drawPauseIcon() {
    if (E.state !== 'play') return;
    const x = W - 34, y = 30;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 7, y - 9, 5, 18); ctx.fillRect(x + 2, y - 9, 5, 18);
    buttons.push({ x: x - 22, y: y - 22, w: 44, h: 44, onClick: E.pause });
    // mute icon
    const mx = W - 84;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(mx, y, 20, 0, 7); ctx.fill();
    drawSpeaker(mx, y);

  };
  function blade(c, x, y, a, col) {
    c.save(); c.translate(x, y); c.rotate(a); c.scale(1.4, 1.4);
    c.fillStyle = col; c.beginPath(); c.moveTo(20, 0); c.lineTo(0, -8); c.lineTo(-14, 0); c.lineTo(0, 8); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(16, 0); c.lineTo(0, -3); c.lineTo(-6, 0); c.lineTo(0, 3); c.fill();
    c.restore();
  }
  function drawEnemy(c, e) {
    const col = COLORS[e.type], pul = Math.sin(e.t * 4) * 2;
    c.globalAlpha = 0.25; c.fillStyle = col; c.beginPath(); c.arc(e.x, e.y, e.r + 8 + pul, 0, 7); c.fill(); c.globalAlpha = 1;
    c.fillStyle = e.stun ? '#999' : col;
    if (e.type === 'spitter') { c.save(); c.translate(e.x, e.y); c.rotate(e.t * 2); c.fillRect(-e.r, -e.r, e.r * 2, e.r * 2); c.restore(); }
    else if (e.type === 'splitter') { c.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.047 + e.t; c.lineTo(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r); } c.fill(); }
    else { c.beginPath(); c.arc(e.x, e.y, e.r, 0, 7); c.fill(); }
    c.fillStyle = '#120a1e'; const ex = Math.cos(Math.atan2(P.y - e.y, P.x - e.x)) * 4, ey = Math.sin(Math.atan2(P.y - e.y, P.x - e.x)) * 4;
    c.beginPath(); c.arc(e.x + ex, e.y + ey, e.r * 0.35, 0, 7); c.fill();
    if (e.type === 'shield') {
      c.strokeStyle = '#fff6c0'; c.lineWidth = 5; c.beginPath(); c.arc(e.x, e.y, e.r + 9, e.face - 1.1, e.face + 1.1); c.stroke();
      c.strokeStyle = '#ffd84a'; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, e.r + 13, e.face - 1.1, e.face + 1.1); c.stroke();
    }
  }
  function arena(c) {
    const g = c.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 600); g.addColorStop(0, '#24123a'); g.addColorStop(1, '#0a0512');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(255,122,217,0.06)'; c.lineWidth = 1;
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + E.t * 0.05; c.beginPath(); c.moveTo(W / 2, H / 2); c.lineTo(W / 2 + Math.cos(a) * 800, H / 2 + Math.sin(a) * 800); c.stroke(); }
    // crystals on the walls
    c.fillStyle = 'rgba(160,100,255,0.12)';
    for (let i = 0; i < 9; i++) { const x = i * 120 + 10, h = 40 + (i * 37) % 60; c.beginPath(); c.moveTo(x, FLOOR); c.lineTo(x + 20, FLOOR - h); c.lineTo(x + 40, FLOOR); c.fill(); }
    c.fillStyle = '#1a0f2a'; c.fillRect(0, FLOOR, W, H - FLOOR);
    c.fillStyle = '#ff7ad9'; c.fillRect(0, FLOOR, W, 3);
    for (const p of PLATS) { c.fillStyle = '#2a1840'; c.fillRect(p.x, p.y, p.w, 12); c.fillStyle = '#c070ff'; c.fillRect(p.x, p.y, p.w, 3); }
  }
  E.dbg = () => ({ P, enemies, wave });
  E.run(game);
})();
