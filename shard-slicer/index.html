/* ===== Shared micro-engine (inlined into each game at build time) =====

   loaded async with offline fallback), input (keys/mouse/touch + virtual
   buttons), procedural audio, juice (shake/particles/flash/hitstop/popups),
   title/pause/gameover flow, best-score storage. */
(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.Engine = { W, H, t: 0, state: 'boot' });

  /* ---------- storage ---------- */
  // Progress (best scores, unlocked levels, mute) is saved in the browser's localStorage.
  E.load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

  E.inUI = (x, y) => y < 56 && x > W - 110;
  E.keys = keys;
  E.down = (...ks) => ks.some((k) => keys[k]);

    if (!keys[e.code]) { pressed[e.code] = true; uiPressed[e.code] = true; }
    keys[e.code] = true;
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden && E.state === 'play') E.pause(true); });

  const ptr = (E.pointer = { x: W / 2, y: H / 2, down: false, clicked: false, released: false });

      activeTouches.delete(t.identifier);
      if (k === 'ptr') { if (![...activeTouches.values()].includes('ptr')) { ptr.down = false; ptr.released = true; } }

  Audio.toggle = () => { Audio.userMuted = !Audio.userMuted; E.save('mute_' + document.title, Audio.userMuted); Audio.apply(); };
  /* tone(freq, dur, type, vol, slideTo, delay) */
  E.tone = function (f, d = 0.1, type = 'square', v = 0.2, slide = 0, delay = 0) {
    const a = Audio.ctx; if (!a || Audio.isMuted()) return;

    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);

  };

    const a = Audio.ctx; if (!a || Audio.isMuted()) return;
    if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }

  };
  /* simple generative music: scale + bass, scheduled ahead */
  const Music = (E.music = { on: false, step: 0, next: 0, bpm: 120, scale: [0, 3, 5, 7, 10], root: 220, pattern: null });
  Music.start = (opts) => { Object.assign(Music, opts || {}); Music.on = true; Music.step = 0; Music.next = Audio.ctx ? Audio.ctx.currentTime + 0.05 : 0; };
  Music.stop = () => { Music.on = false; };
  function musicTick() {
    const a = Audio.ctx; if (!a || !Music.on || Audio.isMuted()) { if (a) Music.next = a.currentTime + 0.05; return; }
    const spb = 60 / Music.bpm / 2;
    while (Music.next < a.currentTime + 0.15) {
      const s = Music.step, t = Music.next - a.currentTime;
      const deg = Music.pattern ? Music.pattern[s % Music.pattern.length] : null;

      if (s % 8 === 4) E.tone(Music.root / 2 * Math.pow(2, Music.scale[3] / 12), spb * 3, 'sine', 0.07, 0, t);
      if (s % 4 === 2) E.noise(0.04, 0.04, 6000, t);
      Music.step++; Music.next += spb;
    }
  }

  let shakeAmt = 0, flashA = 0, flashC = '#fff', hitstop = 0;
  E.shake = (a) => { shakeAmt = Math.max(shakeAmt, a); };
  E.flash = (c = '#fff', a = 0.5) => { flashC = c; flashA = a; };

    for (let i = 0; i < n && parts.length < 900; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, size: size * (0.5 + Math.random()), grav });
    }
  };
  { const b0 = E.burst; E.burst = function (x, y, n, color, spd = 4, life = 30, size = 3, grav = 0.1) { if (E.V3) V3D.burst(x, y, n, { color, speed: spd * 60, life: life / 60, size: size * 1.4, grav: grav * 3600 }); else b0(x, y, n, color, spd, life, size, grav); }; }
  E.spark = (x, y, vx, vy, color, life = 20, size = 3, grav = 0) => { if (parts.length < 900) parts.push({ x, y, vx, vy, life, max: life, color, size, grav }); };
  const popups = [];
  E.popup = (x, y, text, color = '#fff', size = 22) => popups.push({ x, y, text, color, size, life: 50 });
  function updateFx() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.98; p.life--;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 0.8; if (--p.life <= 0) popups.splice(i, 1); }
    shakeAmt *= 0.88; if (shakeAmt < 0.2) shakeAmt = 0; flashA *= 0.9;

    for (const p of parts) {
      c.globalAlpha = Math.max(0, p.life / p.max); c.fillStyle = p.color;
      const s = p.size * (0.4 + 0.6 * p.life / p.max);
      c.fillRect(p.x - camX - s / 2, p.y - camY - s / 2, s, s);
    }
    c.globalAlpha = 1;
  };
  E.drawPopups = function (c, camX = 0, camY = 0) {
    for (const p of popups) { c.globalAlpha = Math.min(1, p.life / 20); E.text(p.text, p.x - camX, p.y - camY, p.size, p.color); }
    c.globalAlpha = 1;
  };
  E.clearFx = () => { parts.length = 0; popups.length = 0; };

<script>
// BG:#0d0716
/* SHARD SLICER — you are a living blade. You can only attack by dashing.

(function () {

  function newWave() {

    if (wave >= 4) pool.push('splitter');

                P.dash = 0; P.vx = -P.dx * 9; P.vy = -P.dy * 9 - 3; chain = 0; P.rech = 30;
                e.stun = 20; e.vx = P.dx * 5; e.vy = P.dy * 5;
                E.shake(8); E.tone(1400, 0.15, 'square', 0.1, 700); E.burst(e.x - P.dx * 16, e.y - P.dy * 16, 14, '#ffd84a', 5, 20, 3, 0); E.popup(e.x, e.y - 30, 'BLOCKED', '#ffd84a', 18);
                continue;
              }
            }
            killEnemy(e);
          } else if (!e.stun) hurt(e.x, e.y);
        }
      }
      enemies = enemies.filter((e) => !e.dead);
      for (let i = shots.length - 1; i >= 0; i--) {
        const s = shots[i]; s.x += s.vx; s.y += s.vy; s.life--;
        if (P.dash > 0 && E.dist(s.x, s.y, P.x, P.y) < 22) { shots.splice(i, 1); score += 5; E.burst(s.x, s.y, 8, '#ff5ea8', 3, 16, 3, 0); E.tone(1000, 0.05, 'square', 0.06); continue; }
        if (E.dist(s.x, s.y, P.x, P.y) < 7 + P.r - 3) { shots.splice(i, 1); hurt(s.x, s.y); continue; }
        if (s.life <= 0 || s.x < 0 || s.x > W || s.y < 0 || s.y > FLOOR) shots.splice(i, 1);
      }
    },
    drawBackground(c) { arena(c); },
    draw(c) {
      if (E.V3) { E.drawParticles(c); } else {
      arena(c);
      for (const s of spawns) { const k = 1 - s.t / 50; c.strokeStyle = COLORS[s.type]; c.globalAlpha = 0.4 + k * 0.6; c.lineWidth = 2; c.beginPath(); c.arc(s.x, s.y, 40 * (1 - k) + 8, 0, 7); c.stroke(); c.beginPath(); c.arc(s.x, s.y, 4, 0, 7); c.stroke(); c.globalAlpha = 1; }
      for (const e of enemies) drawEnemy(c, e);
      c.fillStyle = '#ff5ea8';
      for (const s of shots) { c.globalAlpha = 0.35; c.beginPath(); c.arc(s.x, s.y, 11, 0, 7); c.fill(); c.globalAlpha = 1; c.beginPath(); c.arc(s.x, s.y, 6, 0, 7); c.fill(); }
      for (const g of ghosts) { c.globalAlpha = g.life / 14 * 0.5; blade(c, g.x, g.y, g.a, '#ff7ad9'); }
      c.globalAlpha = 1;
      E.drawParticles(c);
      // player
      if (!(P.inv > 0 && (P.inv >> 2) % 2)) {
        const a = P.dash > 0 ? Math.atan2(P.dy, P.dx) : P.face > 0 ? -0.3 + Math.sin(t * 0.1) * 0.1 : Math.PI + 0.3 - Math.sin(t * 0.1) * 0.1;
        blade(c, P.x, P.y, a, P.charges > 0 ? '#ff7ad9' : '#8a6a90');
        if (P.charges > 0) { c.globalAlpha = 0.25 + Math.sin(t * 0.2) * 0.1; c.fillStyle = '#ff7ad9'; c.beginPath(); c.arc(P.x, P.y, 22, 0, 7); c.fill(); c.globalAlpha = 1; }
      }
      }
      // aim line for mouse users
      if (!E.touchMode && P.charges > 0) { c.strokeStyle = 'rgba(255,122,217,0.25)'; c.setLineDash([4, 8]); c.lineWidth = 2; c.beginPath(); c.moveTo(P.x, P.y); c.lineTo(E.pointer.x, E.pointer.y); c.stroke(); c.setLineDash([]); }
      // HUD
      for (let i = 0; i < 3; i++) { c.fillStyle = i < hearts ? '#ff5e7a' : 'rgba(255,255,255,0.15)'; c.save(); c.translate(32 + i * 30, 30); c.rotate(Math.PI / 4); c.fillRect(-8, -8, 16, 16); c.restore(); }
      E.text('WAVE ' + wave, 24, 64, 18, '#cbb', 'left');
      E.text(String(score), W / 2, 34, 34, '#fff');
      if (chain > 1) E.text('CHAIN x' + chain, W / 2, 68, 22 + Math.min(chain, 12), chain >= 5 ? '#ffd84a' : '#ff9ae4');
      if (banner > 0) { c.globalAlpha = Math.min(1, banner / 30); E.text('WAVE ' + wave, W / 2, 200, 64, '#ff7ad9'); c.globalAlpha = 1; }
      E.drawPopups(c);
    },
  };
  function blade(c, x, y, a, col) {
    c.save(); c.translate(x, y); c.rotate(a); c.scale(1.4, 1.4);
    c.fillStyle = col; c.beginPath(); c.moveTo(20, 0); c.lineTo(0, -8); c.lineTo(-14, 0); c.lineTo(0, 8); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(16, 0); c.lineTo(0, -3); c.lineTo(-6, 0); c.lineTo(0, 3); c.fill();
    c.restore();
  }
  function drawEnemy(c, e) {
    const col = COLORS[e.type], pul = Math.sin(e.t * 4) * 2;
    c.globalAlpha = 0.25; c.fillStyle = col; c.beginPath(); c.arc(e.x, e.y, e.r + 8 + pul, 0, 7); c.fill(); c.globalAlpha = 1;
    c.fillStyle = e.stun ? '#999' : col;
    if (e.type === 'spitter') { c.save(); c.translate(e.x, e.y); c.rotate(e.t * 2); c.fillRect(-e.r, -e.r, e.r * 2, e.r * 2); c.restore(); }
    else if (e.type === 'splitter') { c.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.047 + e.t; c.lineTo(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r); } c.fill(); }
    else { c.beginPath(); c.arc(e.x, e.y, e.r, 0, 7); c.fill(); }
    c.fillStyle = '#120a1e'; const ex = Math.cos(Math.atan2(P.y - e.y, P.x - e.x)) * 4, ey = Math.sin(Math.atan2(P.y - e.y, P.x - e.x)) * 4;
    c.beginPath(); c.arc(e.x + ex, e.y + ey, e.r * 0.35, 0, 7); c.fill();
    if (e.type === 'shield') {
      c.strokeStyle = '#fff6c0'; c.lineWidth = 5; c.beginPath(); c.arc(e.x, e.y, e.r + 9, e.face - 1.1, e.face + 1.1); c.stroke();
      c.strokeStyle = '#ffd84a'; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, e.r + 13, e.face - 1.1, e.face + 1.1); c.stroke();
    }
  }
  function arena(c) {
    const g = c.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 600); g.addColorStop(0, '#24123a'); g.addColorStop(1, '#0a0512');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(255,122,217,0.06)'; c.lineWidth = 1;
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + E.t * 0.05; c.beginPath(); c.moveTo(W / 2, H / 2); c.lineTo(W / 2 + Math.cos(a) * 800, H / 2 + Math.sin(a) * 800); c.stroke(); }
    // crystals on the walls
    c.fillStyle = 'rgba(160,100,255,0.12)';
    for (let i = 0; i < 9; i++) { const x = i * 120 + 10, h = 40 + (i * 37) % 60; c.beginPath(); c.moveTo(x, FLOOR); c.lineTo(x + 20, FLOOR - h); c.lineTo(x + 40, FLOOR); c.fill(); }
    c.fillStyle = '#1a0f2a'; c.fillRect(0, FLOOR, W, H - FLOOR);
    c.fillStyle = '#ff7ad9'; c.fillRect(0, FLOOR, W, 3);
    for (const p of PLATS) { c.fillStyle = '#2a1840'; c.fillRect(p.x, p.y, p.w, 12); c.fillStyle = '#c070ff'; c.fillRect(p.x, p.y, p.w, 3); }
  }
  E._s = () => ({ P, enemies, shots, spawns, ghosts, t, FLOOR, PLATS, COLORS });
  E.dbg = () => ({ P, enemies, wave });
  E.run(game);
})();

</script>
