<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0820;touch-action:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

<script>
/* ===== Shared micro-engine (inlined into each game at build time) =====
   Logical resolution 960x540, letterboxed. Handles: (no platform SDK,
   loaded async with offline fallback), input (keys/mouse/touch + virtual

  'use strict';
  const W = 960, H = 540;
  const E = (window.Engine = { W, H, t: 0, state: 'boot' });

  /* ---------- storage ---------- */
  // Progress (best scores, unlocked levels, mute) is saved in the browser's localStorage.

  E.rand = (a, b) => a + Math.random() * (b - a);

    E.button(Audio.userMuted ? 'SOUND: OFF' : 'SOUND: ON', W / 2, 340, 240, 50, Audio.toggle, '#aaa');

<script>
// BG:#0a0820
/* CHROMA HOP — an endless runner where you only exist in one colour at a time.
   You can only stand on platforms of your colour and only pass gates of your colour.
   Swap colours mid-air to slip through gates, then swap back before you land. */
(function () {
  const E = Engine, W = E.W, H = E.H;
  const COL = ['#2ef2ff', '#ff3dbb'], GLOW = ['rgba(46,242,255,', 'rgba(255,61,187,'];
  const GATE_H = 150;

  function plat(x, y, w, c) { plats.push({ x, y, w, c }); }

    while (genX < upto) {
      const diff = Math.min(1, dist / 25000);
      const gapK = speed / 6;
      const r = Math.random();
      const c = Math.random() < 0.5 ? 0 : 1;

        genX += w;

        genX += gap(); const base = ny(), w = E.rand(500, 700);

    P.c = 1 - P.c; P.swapFx = 10;

    for (let i = 0; i < 10; i++) { const a = Math.random() * 6.28; E.spark(P.x, P.y, Math.cos(a) * 3, Math.sin(a) * 3, COL[P.c], 16, 3); }
  }
  function die(msg) {
    E.shake(18); E.flash(COL[P.c], 0.5); E.hitstop(0.08);
    for (let i = 0; i < 50; i++) { const a = Math.random() * 6.28, s = E.rand(2, 9); E.spark(P.x, P.y, Math.cos(a) * s, Math.sin(a) * s, E.pick(COL), 50, 6, 0.15); }
    E.noise(0.6, 0.45, 2500); E.tone(440, 0.5, 'sawtooth', 0.14, 55);
    E.gameOver(score(), [msg, 'Distance ' + Math.floor(dist / 10) + ' m   ·   Gates ' + gatesPassed]);
  }
  const score = () => Math.floor(dist / 10) + bonus;

  const game = {
    id: 'chroma-hop', title: 'CHROMA HOP', color: '#2ef2ff',
    tagline: 'Exist in one colour at a time. Stand on it. Pass through it. Swap to survive.',
    overTitle: 'DESATURATED',
    controls: ['SPACE / W / UP / LEFT CLICK : jump (double jump)', 'SHIFT / X / S / DOWN / RIGHT CLICK : swap colour', 'Only your colour is solid. Gates of the other colour shatter you.', 'Swap mid-air to pass a gate, swap back before landing!'],

      const was = P.ground; P.ground = false;

      P.squash = E.lerp(P.squash, 1, 0.2);
      P.rot += P.ground ? speed * 0.05 : 0.18;

          if (g.c === P.c || prism > 0) {
            g.passed = true; gatesPassed++; combo++; comboT = 120; const pts = 25 * Math.min(combo, 8); bonus += pts;
            E.shake(4); E.tone(880, 0.12, 'square', 0.08, 1760); E.popup(wx, g.y - 14, 'PHASE +' + pts, COL[g.c], 20);
            for (let i = 0; i < 18; i++) E.spark(g.x + 7, g.y + Math.random() * g.h, E.rand(1, 6), E.rand(-2, 2), COL[g.c], 24, 4);

        }

      for (const o of orbs) {
        if (o.got || Math.abs(o.x - wx) > 22 || Math.abs(o.y - P.y) > 24) continue;
        if (o.c === P.c || prism > 0) { o.got = true; combo++; comboT = 90; bonus += 5 * Math.min(combo, 10); E.tone(1046 + Math.min(combo, 12) * 40, 0.05, 'square', 0.06); E.burst(o.x, o.y, 5, COL[o.c], 2, 14, 3, 0); }
      }
      for (const p of prisms) if (!p.got && Math.abs(p.x - wx) < 26 && Math.abs(p.y - P.y) < 26) {
        p.got = true; prism = 300; bonus += 100; E.flash('#fff', 0.4); E.shake(6); E.popup(wx, p.y - 30, 'PRISM! all colours solid', '#fff', 22);
        [523, 659, 784, 988, 1175].forEach((f, i) => E.tone(f, 0.12, 'triangle', 0.1, 0, i * 0.05)); E.sdk.happy();

    drawBackground(c, t) { bg(c, t * 60); },

        c.fillStyle = GLOW[p.c] + (on ? '0.25)' : '0.1)'); c.fillRect(x - 4, p.y - 4, p.w + 8, 22);
        c.fillStyle = COL[p.c]; c.fillRect(x, p.y, p.w, 5);
        c.fillStyle = GLOW[p.c] + '0.35)'; c.fillRect(x, p.y + 5, p.w, 9);
        if (!on) { c.strokeStyle = COL[p.c]; c.setLineDash([8, 8]); c.lineWidth = 1; c.strokeRect(x, p.y, p.w, 14); c.setLineDash([]); }
        c.globalAlpha = 1;
      }
      for (const g of gates) {
        const x = g.x - camX; if (x < -30 || x > W + 30) continue;
        const ok = g.c === P.c || prism > 0;
        c.globalAlpha = g.passed ? 0.2 : 1;
        c.fillStyle = GLOW[g.c] + '0.2)'; c.fillRect(x - 10, g.y, 34, g.h);
        c.fillStyle = COL[g.c]; c.fillRect(x, g.y, 14, g.h);
        c.fillStyle = 'rgba(255,255,255,0.6)'; for (let y = g.y + ((E.t * 80) % 20); y < g.y + g.h; y += 20) c.fillRect(x + 3, y, 8, 3);
        if (!ok && !g.passed) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 6, g.y - 18); c.lineTo(x + 20, g.y - 4); c.moveTo(x + 20, g.y - 18); c.lineTo(x - 6, g.y - 4); c.stroke(); }
        c.globalAlpha = 1;
      }
      for (const o of orbs) {
        const x = o.x - camX; if (x < -20 || x > W + 20) continue;
        const on = o.c === P.c || prism > 0;
        c.globalAlpha = on ? 1 : 0.3; c.fillStyle = COL[o.c]; c.beginPath(); c.arc(x, o.y + Math.sin(E.t * 5 + o.x) * 3, on ? 6 : 4, 0, 7); c.fill(); c.globalAlpha = 1;
      }
      for (const p of prisms) {
        const x = p.x - camX; if (x < -30 || x > W + 30) continue;
        c.save(); c.translate(x, p.y + Math.sin(E.t * 3) * 5); c.rotate(E.t);
        const gr = c.createLinearGradient(-14, -14, 14, 14); gr.addColorStop(0, COL[0]); gr.addColorStop(0.5, '#fff'); gr.addColorStop(1, COL[1]);
        c.fillStyle = gr; c.beginPath(); c.moveTo(0, -16); c.lineTo(14, 10); c.lineTo(-14, 10); c.fill(); c.restore();
      }
      c.strokeStyle = COL[P.c]; c.lineWidth = 2;
      for (const r of rings) { c.globalAlpha = r.life / 18; c.beginPath(); c.ellipse(r.x - camX, r.y, r.r * 1.6, r.r * 0.5, 0, 0, 7); c.stroke(); }
      c.globalAlpha = 1;
      E.drawParticles(c, camX, 0);
      // player
      c.save(); c.translate(P.x, P.y + P.r); c.scale(1 / Math.sqrt(P.squash), P.squash); c.translate(0, -P.r);
      const pc = prism > 0 ? COL[(runT >> 3) % 2] : COL[P.c];
      c.fillStyle = GLOW[P.c] + '0.3)'; c.beginPath(); c.arc(0, 0, P.r + 8 + P.swapFx, 0, 7); c.fill();
      c.fillStyle = pc; c.beginPath(); c.arc(0, 0, P.r, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(5, -3, 4.5, 0, 7); c.arc(-3, -3, 3.5, 0, 7); c.fill();
      c.fillStyle = '#0a0820'; c.beginPath(); c.arc(6.5, -2.5, 2, 0, 7); c.arc(-1.8, -2.5, 1.7, 0, 7); c.fill();
      c.restore();
      // HUD
      E.text(String(score()), W / 2, 34, 34, '#fff');
      E.text(Math.floor(dist / 10) + ' m', W / 2, 62, 16, '#aab');
      c.fillStyle = 'rgba(0,0,0,0.4)'; E.roundRect(18, 16, 132, 40, 10); c.fill();
      c.fillStyle = COL[0]; c.globalAlpha = P.c === 0 ? 1 : 0.25; E.roundRect(26, 24, 54, 24, 6); c.fill();
      c.fillStyle = COL[1]; c.globalAlpha = P.c === 1 ? 1 : 0.25; E.roundRect(88, 24, 54, 24, 6); c.fill(); c.globalAlpha = 1;
      if (combo >= 3) E.text('COMBO x' + combo, 24, 76, 18, COL[P.c], 'left');
      if (prism > 0) { c.fillStyle = '#fff'; c.fillRect(W / 2 - 100, 78, 200 * (prism / 300), 5); }
      E.drawPopups(c, camX, 0);
    },
  };
  function bg(c, cx) {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07061a'); g.addColorStop(0.6, '#1a0b3a'); g.addColorStop(1, '#2a0a3a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (const s of stars || []) { c.fillStyle = 'rgba(255,255,255,' + s.s * 1.6 + ')'; c.fillRect(((s.x - cx * s.s * 0.2) % W + W) % W, s.y, 2, 2); }
    // twin moons, one per colour
    c.fillStyle = 'rgba(46,242,255,0.18)'; c.beginPath(); c.arc(260, 150, 70, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,61,187,0.18)'; c.beginPath(); c.arc(330, 120, 45, 0, 7); c.fill();
    // receding floor grid
    c.strokeStyle = 'rgba(255,61,187,0.18)'; c.lineWidth = 1;
    for (let i = 0; i < 10; i++) { const y = 440 + i * i * 1.3; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    const off = (cx * 0.5) % 80;
    for (let x = -off - 400; x < W + 400; x += 80) { c.beginPath(); c.moveTo(W / 2 + (x - W / 2) * 0.3, 440); c.lineTo(x, H); c.stroke(); }
    // far skyline bars
    c.fillStyle = '#120a2a';
    for (let i = 0; i < 16; i++) { const k = 0.3, w = 70, x = ((i * w - cx * k) % (16 * w) + 16 * w) % (16 * w) - w, h = 60 + ((i * 53) % 110); c.fillRect(x, 440 - h, w - 8, h); }
  }
  E.dbg = () => ({ P, plats, gates, camX });
  E.run(game);
})();
