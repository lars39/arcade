/* ===== Shared micro-engine (inlined into each game at build time) =====

(function () {
  'use strict';

  /* ---------- storage ---------- */
  // Progress (best scores, unlocked levels, mute) is saved in the browser's localStorage.
  E.load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };

  function tstart(e) {

  Music.start = (opts) => { Object.assign(Music, opts || {}); Music.on = true; Music.step = 0; Music.next = Audio.ctx ? Audio.ctx.currentTime + 0.05 : 0; };
  Music.stop = () => { Music.on = false; };

      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, color, size: size * (0.5 + Math.random()), grav });

  };

  const popups = [];
  E.popup = (x, y, text, color = '#fff', size = 22) => popups.push({ x, y, text, color, size, life: 50 });
  function updateFx() {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.98; p.life--;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.y -= 0.8; if (--p.life <= 0) popups.splice(i, 1); }
    shakeAmt *= 0.88; if (shakeAmt < 0.2) shakeAmt = 0; flashA *= 0.9;
  }

    for (const p of parts) {

      const s = p.size * (0.4 + 0.6 * p.life / p.max);
      c.fillRect(p.x - camX - s / 2, p.y - camY - s / 2, s, s);
    }
    c.globalAlpha = 1;
  };
  E.drawPopups = function (c, camX = 0, camY = 0) {
    for (const p of popups) { c.globalAlpha = Math.min(1, p.life / 20); E.text(p.text, p.x - camX, p.y - camY, p.size, p.color); }
    c.globalAlpha = 1;
  };
  E.clearFx = () => { parts.length = 0; popups.length = 0; };

  E.font = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
  E.text = function (s, x, y, size = 24, color = '#fff', align = 'center', outline = true) {

  };

  E.button = function (label, x, y, w, h, onClick, color = '#ffffff') {
    const hov = ptr.x > x - w / 2 && ptr.x < x + w / 2 && ptr.y > y - h / 2 && ptr.y < y + h / 2;
    ctx.fillStyle = hov ? color : 'rgba(0,0,0,0.45)';
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    roundRect(x - w / 2, y - h / 2, w, h, 12); ctx.fill(); ctx.stroke();
    E.text(label, x, y + 1, Math.min(28, h * 0.5), hov ? '#111' : color, 'center', !hov);

  E.resume = () => { if (E.state !== 'pause') return; E.state = 'play'; SDK.start(); G.music && Music.start(G.music); };

    E.clearFx(); E.score = 0; E.newBest = false;
    G.start && G.start();
    E.state = 'play'; SDK.start();
    G.music && Music.start(G.music);
  };

    E.state = 'over'; E.overT = 0; SDK.stop(); Music.stop();
  };
  E.toTitle = () => { E.state = 'title'; SDK.stop(); Music.stop(); };

  E.retry = () => { E.state = 'ad'; SDK.midgame(() => E.startRun()); };

  function drawPauseIcon() {

      if (combo >= 3) E.text('COMBO x' + combo, 24, 76, 18, COL[P.c], 'left');
      if (prism > 0) { c.fillStyle = '#fff'; c.fillRect(W / 2 - 100, 78, 200 * (prism / 300), 5); }
      E.drawPopups(c, camX, 0);
    },
  };
  function bg(c, cx) {
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#07061a'); g.addColorStop(0.6, '#1a0b3a'); g.addColorStop(1, '#2a0a3a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    for (const s of stars || []) { c.fillStyle = 'rgba(255,255,255,' + s.s * 1.6 + ')'; c.fillRect(((s.x - cx * s.s * 0.2) % W + W) % W, s.y, 2, 2); }

    c.fillStyle = 'rgba(46,242,255,0.18)'; c.beginPath(); c.arc(260, 150, 70, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,61,187,0.18)'; c.beginPath(); c.arc(330, 120, 45, 0, 7); c.fill();
    // receding floor grid
    c.strokeStyle = 'rgba(255,61,187,0.18)'; c.lineWidth = 1;
    for (let i = 0; i < 10; i++) { const y = 440 + i * i * 1.3; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    const off = (cx * 0.5) % 80;
    for (let x = -off - 400; x < W + 400; x += 80) { c.beginPath(); c.moveTo(W / 2 + (x - W / 2) * 0.3, 440); c.lineTo(x, H); c.stroke(); }
    // far skyline bars
    c.fillStyle = '#120a2a';
    for (let i = 0; i < 16; i++) { const k = 0.3, w = 70, x = ((i * w - cx * k) % (16 * w) + 16 * w) % (16 * w) - w, h = 60 + ((i * 53) % 110); c.fillRect(x, 440 - h, w - 8, h); }
  }
  E._s = () => ({ P, plats, gates, orbs, prisms, rings, camX, prism, runT, speed, COL, solidFor });
  E.dbg = () => ({ P, plats, gates, camX });
  E.run(game);
})();
