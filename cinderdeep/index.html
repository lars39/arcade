<script>
// ===== Shared mini-engine (inlined into each game at build time) =====
(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.E = { W, H, t: 0, dt: 0, paused: false, state: 'title', muted: false });

  // ---------- storage ----------
  // Progress (best score, unlocks, mute) is saved in the browser's localStorage.

  // ---------- audio (procedural) ----------

  E.tone = (f, dur, o = {}) => {

      case 'laser': E.tone(1400 * p, 0.12, { type: 'sawtooth', vol: 0.07, slide: 0.3 }); break;
      case 'hit': E.tone(220 * p, 0.07, { type: 'square', vol: 0.12, slide: 0.6 }); E.noise(0.05, { freq: 3000, vol: 0.1 }); break;
      case 'kill': E.tone(520 * p, 0.12, { type: 'triangle', vol: 0.18, slide: 0.4 }); E.noise(0.15, { freq: 1500, vol: 0.15, fslide: 0.2 }); break;

      case 'coin': E.tone(1320 * p, 0.06, { type: 'square', vol: 0.06 }); E.tone(1760 * p, 0.1, { type: 'square', vol: 0.06, when: now + 0.05 }); break;

      const s = spd * E.rand(0.3, 1);

<script>
// CINDERDEEP — action-roguelite. You are a living lantern flame descending a crypt.
(function () {
  const { W, H } = E;
  const G = { id: 'cinderdeep' };
  let P, bolts, ebolts, foes, embers, pillars, room, depth, phase, doorOpen, best, kills, runTime, boons, dark, dctx, banner, bannerT;
  const WALL = 28;

  const BOONS = [
    { id: 'dmg', i: '🔥', n: 'Hotter Core', d: '+35% bolt damage', f: () => (P.dmg *= 1.35) },
    { id: 'rate', i: '⚡', n: 'Quick Wick', d: '+25% fire rate', f: () => (P.rate *= 0.8) },
    { id: 'multi', i: '✳️', n: 'Split Flame', d: '+1 bolt per shot (spread)', f: () => (P.multi += 1), max: 4 },
    { id: 'pierce', i: '🗡️', n: 'Lancing Ember', d: 'Bolts pierce +1 foe', f: () => (P.pierce += 1) },
    { id: 'flame', i: '❤️', n: 'Deeper Oil', d: '+25 max flame, full refill', f: () => { P.maxHp += 25; P.hp = P.maxHp; } },
    { id: 'dash', i: '💨', n: 'Smoke Step', d: 'Dash cooldown -30%', f: () => (P.dashCd *= 0.7) },
    { id: 'magnet', i: '🧲', n: 'Ember Pull', d: 'Embers fly to you from afar', f: () => (P.magnet += 90) },
    { id: 'burn', i: '♨️', n: 'Clinging Fire', d: 'Hits ignite foes (burn over time)', f: () => (P.burn += 1) },
    { id: 'boom', i: '💥', n: 'Pyre Burst', d: 'Foes explode on death, hurting others', f: () => (P.boom += 1) },
    { id: 'wisp', i: '🌀', n: 'Orbit Wisp', d: 'A wisp circles you, burning foes', f: () => (P.wisps += 1), max: 4 },
    { id: 'bounce', i: '↩️', n: 'Rebound', d: 'Bolts bounce off walls +1', f: () => (P.bounce += 1) },
    { id: 'leech', i: '🩸', n: 'Soot Drinker', d: 'Kills restore +2 flame', f: () => (P.leech += 2) },
    { id: 'speed', i: '👟', n: 'Light Feet', d: '+12% move speed', f: () => (P.speed *= 1.12) },
    { id: 'big', i: '🟠', n: 'Bonfire Bolts', d: 'Bolts 40% larger, +15% dmg', f: () => { P.bsize *= 1.4; P.dmg *= 1.15; } },
  ];

  function newPlayer() {
    return { x: W / 2, y: H - 90, r: 12, hp: 100, maxHp: 100, speed: 210, dmg: 10, rate: 0.28, cd: 0, multi: 1, pierce: 0, bspeed: 520, bsize: 5,
      dashCd: 1.1, dashT: 0, dashCool: 0, inv: 0, magnet: 60, burn: 0, boom: 0, wisps: 0, bounce: 0, leech: 0, fx: 0, fy: -1, flick: 0 };
  }

  G.init = () => {
    best = E.load('best', 0);
    dark = document.createElement('canvas'); dark.width = W; dark.height = H; dctx = dark.getContext('2d');
    E.touchButtons = [{ id: 'dash', label: 'DASH', x: W - 90, y: H - 90, r: 46, color: '#ffb347' }];
  };

  G.toTitle = () => {
    E.setState('title'); setupRoom(true);
    E.ui(`<h1>CINDERDEEP</h1><div class="tag">You are the last flame. Descend the crypt. Keep burning.</div>
      <button id="bPlay">Descend</button>
      <p class="hint">Move: WASD / Arrows · Aim: Mouse · Shoot: Hold Click · Dash: Space / Right-click<br>Touch: left stick to move, touch right side to aim & fire</p>
      <p class="hint">Deepest room: ${best}</p>`);
    E.on('bPlay', startRun);
  };

  function startRun() {
    P = newPlayer(); depth = 0; kills = 0; runTime = 0; boons = {};
    E.ui(null); nextRoom();
  }

  function setupRoom(demo) {
    if (depth == null) depth = 0;
    bolts = []; ebolts = []; foes = []; embers = []; pillars = [];
    if (demo) { P = P || newPlayer(); room = 0; for (let i = 0; i < 6; i++) spawnFoe(E.pick(['moth', 'moth', 'caster']), true); }
  }

  function nextRoom() {
    depth++; setupRoom(false); doorOpen = false; phase = 'fight';
    P.x = W / 2; P.y = H - 70;
    const boss = depth % 5 === 0;
    // pillars layout
    if (!boss) {
      const n = E.randi(2, 5);
      for (let i = 0; i < n; i++) {
        const w = E.randi(40, 90), h = E.randi(40, 90);
        const x = E.rand(WALL + 60, W - WALL - 60 - w), y = E.rand(WALL + 60, H - WALL - 140 - h);

    }
    if (boss) {
      spawnFoe('boss');
      showBanner('THE WAX COLOSSUS', '#ff7043');
    } else {
      const budget = 4 + depth * 1.6;
      let b = 0;
      while (b < budget) {
        const t = E.pick(depth < 2 ? ['moth', 'moth', 'caster'] : depth < 4 ? ['moth', 'caster', 'brute', 'moth'] : ['moth', 'caster', 'brute', 'urn', 'caster', 'moth']);
        spawnFoe(t); b += { moth: 1, caster: 1.6, brute: 2.4, urn: 3 }[t];
      }
      showBanner('ROOM ' + depth, '#ffd27f');
    }
    E.setState('play');
  }

  function showBanner(t, c) { banner = { t, c }; bannerT = 1.8; }

  function freeSpot(r) {
    for (let k = 0; k < 40; k++) {
      const x = E.rand(WALL + r + 10, W - WALL - r - 10), y = E.rand(WALL + r + 10, H * 0.65);
      if (E.dist(x, y, P.x, P.y) < 200) continue;
      if (!pillars.some((p) => x > p.x - r && x < p.x + p.w + r && y > p.y - r && y < p.y + p.h + r)) return [x, y];
    }
    return [W / 2, 100];
  }

  function spawnFoe(type, demo, at) {
    const s = 1 + depth * 0.12;
    const T = {
      moth: { r: 10, hp: 14, spd: 120, col: '#c9b3ff', dmg: 10 },
      caster: { r: 13, hp: 26, spd: 60, col: '#7fe3ff', dmg: 12 },
      brute: { r: 20, hp: 70, spd: 50, col: '#ff8a65', dmg: 22 },
      urn: { r: 18, hp: 60, spd: 0, col: '#d4a373', dmg: 0 },
      boss: { r: 46, hp: 900, spd: 55, col: '#ffcc80', dmg: 25 },
    }[type];
    const [x, y] = at || freeSpot(T.r);
    const f = { type, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp * s, max: T.hp * s, spd: T.spd * (1 + depth * 0.03), col: T.col, dmg: T.dmg, t: E.rand(0, 2), flash: 0, burn: 0, state: 'idle', st: 0, spawnT: demo ? 0 : 0.6 };
    if (type === 'boss') { f.hp = f.max = 900 * (1 + (depth / 5 - 1) * 0.8); }
    foes.push(f); return f;
  }

  // --- collisions ---
  function pushOut(o) {
    o.x = E.clamp(o.x, WALL + o.r, W - WALL - o.r); o.y = E.clamp(o.y, WALL + o.r, H - WALL - o.r);
    for (const p of pillars) {
      const cx = E.clamp(o.x, p.x, p.x + p.w), cy = E.clamp(o.y, p.y, p.y + p.h);
      const dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
      if (d < o.r) {
        if (d === 0) { o.y = p.y - o.r; continue; }
        o.x = cx + (dx / d) * o.r; o.y = cy + (dy / d) * o.r;
      }
    }
  }
  function inPillar(x, y) { return pillars.find((p) => x > p.x && x < p.x + p.w && y > p.y && y < p.y + p.h); }

  function hurtPlayer(d, fromX, fromY) {
    if (P.inv > 0 || P.dashT > 0) return;
    P.hp -= d; P.inv = 0.8; E.shake(9); E.flash('#ff2200', 0.25); E.sfx('hurt'); E.hitstop(0.06);
    const a = E.angTo(fromX, fromY, P.x, P.y); P.x += Math.cos(a) * 16; P.y += Math.sin(a) * 16;
    E.burst(P.x, P.y, '#ffae42', 16, 220, 0.5, 4);
    if (P.hp <= 0) die();
  }

  function die() {
    if (E.state !== 'play') return;
    P.hp = 0; E.sfx('lose'); E.shake(18); E.burst(P.x, P.y, '#ffcc66', 60, 400, 1.2, 5);
    if (depth > best) { best = depth; E.save('best', best); }
    E.setState('over');
    setTimeout(() => E.sdk.midgame(() => {
      E.ui(`<h2>Your flame went out</h2><div class="stats">Reached room <b>${depth}</b> · Foes burned <b>${kills}</b> · Time ${Math.floor(runTime)}s<br>Deepest ever: <b>${best}</b></div>
        <button id="bAgain">Rekindle</button><button id="bMenu" class="sec">Title</button>`);
      E.on('bAgain', startRun); E.on('bMenu', G.toTitle);
    }), 900);
  }

  function damageFoe(f, d, kx, ky) {
    f.hp -= d; f.flash = 0.1; if (kx != null) { f.x += kx; f.y += ky; }
    E.popText(f.x, f.y - f.r, Math.round(d), '#ffe0a0', 14);
    if (f.hp <= 0 && !f.dead) killFoe(f); else E.sfx('hit', E.rand(0.9, 1.2));
  }
  function killFoe(f) {
    f.dead = true; kills++; E.sfx('kill', E.rand(0.8, 1.2)); E.shake(f.type === 'boss' ? 25 : 4);
    E.burst(f.x, f.y, f.col, f.type === 'boss' ? 120 : 18, f.type === 'boss' ? 500 : 240, 0.7, 4);
    const n = f.type === 'boss' ? 25 : f.type === 'brute' ? 4 : f.type === 'urn' ? 3 : E.randi(1, 2);
    for (let i = 0; i < n; i++) embers.push({ x: f.x + E.rand(-10, 10), y: f.y + E.rand(-10, 10), vx: E.rand(-120, 120), vy: E.rand(-120, 120), t: 0 });
    if (P.leech) P.hp = Math.min(P.maxHp, P.hp + P.leech);
    if (P.boom) {
      E.burst(f.x, f.y, '#ff6a00', 20, 300, 0.4, 5);
      for (const o of foes) if (o !== f && !o.dead && E.dist(o.x, o.y, f.x, f.y) < 70 + P.boom * 15) damageFoe(o, 8 * P.boom * (1 + depth * 0.05));
    }
    if (f.type === 'boss') { E.sdk.happytime(); E.hitstop(0.25); E.flash('#fff', 0.6); }
  }

  function shoot() {
    const a = E.angTo(P.x, P.y, E.input.aimX, E.input.aimY);
    P.fx = Math.cos(a); P.fy = Math.sin(a);
    const n = P.multi, spread = 0.16;
    for (let i = 0; i < n; i++) {
      const aa = a + (i - (n - 1) / 2) * spread;
      bolts.push({ x: P.x + Math.cos(aa) * 14, y: P.y + Math.sin(aa) * 14, vx: Math.cos(aa) * P.bspeed, vy: Math.sin(aa) * P.bspeed, life: 1.1, pierce: P.pierce, bounce: P.bounce, hit: new Set(), r: P.bsize });
    }
    E.sfx('shoot', E.rand(0.9, 1.1));
    P.x -= Math.cos(a) * 1.5; P.y -= Math.sin(a) * 1.5;
  }

  function offerBoons() {
    phase = 'boon'; E.setState('menu');
    const pool = E.shuffle(BOONS.filter((b) => !b.max || (boons[b.id] || 0) < b.max)).slice(0, 3);
    const html = pool.map((b, i) => `<div class="card" id="boon${i}"><i>${b.i}</i><b>${b.n}</b><span>${b.d}</span>${boons[b.id] ? `<span style="opacity:.6">Owned ×${boons[b.id]}</span>` : ''}</div>`).join('');
    E.ui(`<h2>Choose a Boon</h2><p class="hint">Room ${depth} cleared · flame +15</p><div class="row">${html}</div>`);
    pool.forEach((b, i) => E.on('boon' + i, () => { b.f(); boons[b.id] = (boons[b.id] || 0) + 1; E.sfx('power'); E.ui(null); phase = 'door'; E.setState('play'); }));
  }

  G.update = (dt) => {
    if (bannerT > 0) bannerT -= dt;
    if (E.state === 'title') { demoUpdate(dt); return; }
    if (E.state !== 'play' && E.state !== 'over') return;
    const alive = E.state === 'play';
    if (alive) runTime += dt;

    // --- player ---
    if (alive) {
      const m = E.input.move;
      P.dashCool -= dt; P.inv -= dt; P.cd -= dt; P.flick += dt;
      if ((E.hit(' ') || E.hit('mouse2') || E.hit('btn:dash') || E.hit('Shift')) && P.dashCool <= 0) {
        let dx = m.x, dy = m.y; if (!dx && !dy) { dx = P.fx; dy = P.fy; }
        const l = Math.hypot(dx, dy) || 1; P.dvx = (dx / l) * 680; P.dvy = (dy / l) * 680; P.dashT = 0.16; P.dashCool = P.dashCd; E.sfx('dash');
      }
      if (P.dashT > 0) {
        P.dashT -= dt; P.x += P.dvx * dt; P.y += P.dvy * dt;
        E.burst(P.x, P.y, '#ffb347', 2, 60, 0.35, 5);
      } else { P.x += m.x * P.speed * dt; P.y += m.y * P.speed * dt; }
      pushOut(P);
      if (E.input.fire && P.cd <= 0) { shoot(); P.cd = P.rate; }
      // slow flame decay while fighting (pressure)
      if (phase === 'fight') P.hp -= dt * (0.6 + depth * 0.05);
      if (P.hp <= 0) die();
      if (Math.random() < 0.5) E.burst(P.x + E.rand(-4, 4), P.y - 6, E.pick(['#ffcc66', '#ff8a00']), 1, 40, 0.5, 3, { ang: -Math.PI / 2, spread: 0.4, drag: 1 });
    }

    // --- bolts ---
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i]; b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
      let wall = false;
      if (b.x < WALL || b.x > W - WALL) { if (b.bounce-- > 0) { b.vx *= -1; b.x = E.clamp(b.x, WALL, W - WALL); } else wall = true; }
      if (b.y < WALL || b.y > H - WALL) { if (b.bounce-- > 0) { b.vy *= -1; b.y = E.clamp(b.y, WALL, H - WALL); } else wall = true; }
      const pp = inPillar(b.x, b.y);
      if (pp) {
        if (b.bounce-- > 0) { const px = b.x - b.vx * dt, py = b.y - b.vy * dt; if (px < pp.x || px > pp.x + pp.w) b.vx *= -1; else b.vy *= -1; b.x = px; b.y = py; } else wall = true;
      }
      if (wall || b.life <= 0) { E.burst(b.x, b.y, '#ffb347', 5, 120, 0.25, 3); bolts.splice(i, 1); continue; }
      for (const f of foes) {
        if (f.dead || f.spawnT > 0 || b.hit.has(f)) continue;
        if (E.dist(b.x, b.y, f.x, f.y) < f.r + b.r) {
          b.hit.add(f); const l = Math.hypot(b.vx, b.vy);
          damageFoe(f, P.dmg, f.type === 'boss' ? 0 : (b.vx / l) * 6, f.type === 'boss' ? 0 : (b.vy / l) * 6);
          if (P.burn) f.burn = Math.max(f.burn, 2.0);
          E.burst(b.x, b.y, '#ffd27f', 6, 160, 0.3, 3);
          if (b.pierce-- <= 0) { b.life = 0; break; }
        }
      }
    }
    // --- wisps ---
    for (let k = 0; k < P.wisps; k++) {
      const a = E.t * 3 + (k / P.wisps) * Math.PI * 2, wx = P.x + Math.cos(a) * 46, wy = P.y + Math.sin(a) * 46;
      for (const f of foes) if (!f.dead && f.spawnT <= 0 && E.dist(wx, wy, f.x, f.y) < f.r + 8) { f.wispT = (f.wispT || 0) - dt; if (f.wispT <= 0) { f.wispT = 0.3; damageFoe(f, P.dmg * 0.6); } }
    }

    // --- foes ---
    for (const f of foes) {
      if (f.dead) continue;
      f.t += dt; f.flash -= dt;
      if (f.spawnT > 0) { f.spawnT -= dt; continue; }
      if (f.burn > 0) { f.burn -= dt; f.burnTick = (f.burnTick || 0) - dt; if (f.burnTick <= 0) { f.burnTick = 0.4; damageFoe(f, 3 * P.burn * (1 + depth * 0.05)); E.burst(f.x, f.y, '#ff5500', 3, 60, 0.4, 3); } if (f.dead) continue; }
      const a = E.angTo(f.x, f.y, P.x, P.y), d = E.dist(f.x, f.y, P.x, P.y);
      if (!alive) { f.x -= Math.cos(a) * 20 * dt; f.y -= Math.sin(a) * 20 * dt; continue; }
      if (f.type === 'moth') {
        const wob = Math.sin(f.t * 6) * 0.9;
        f.x += Math.cos(a + wob) * f.spd * dt; f.y += Math.sin(a + wob) * f.spd * dt;
      } else if (f.type === 'caster') {
        const want = d > 260 ? 1 : d < 180 ? -1 : 0;
        f.x += (Math.cos(a) * want + Math.cos(a + 1.57) * 0.5 * Math.sin(f.t)) * f.spd * dt; f.y += (Math.sin(a) * want + Math.sin(a + 1.57) * 0.5 * Math.sin(f.t)) * f.spd * dt;
        f.st -= dt; if (f.st <= 0) { f.st = E.rand(1.6, 2.4) / (1 + depth * 0.04); eShoot(f.x, f.y, a, 170 + depth * 6, '#7fe3ff'); }
      } else if (f.type === 'brute') {
        if (f.state === 'idle') { f.x += Math.cos(a) * f.spd * dt; f.y += Math.sin(a) * f.spd * dt; f.st -= dt; if (f.st <= 0 && d < 340) { f.state = 'wind'; f.st = 0.6; f.ca = a; } }
        else if (f.state === 'wind') { f.st -= dt; f.x += E.rand(-1, 1) * 2; if (f.st <= 0) { f.state = 'charge'; f.st = 0.55; E.sfx('dash'); } }
        else { f.x += Math.cos(f.ca) * 430 * dt; f.y += Math.sin(f.ca) * 430 * dt; f.st -= dt; if (f.st <= 0) { f.state = 'idle'; f.st = E.rand(1.5, 2.5); } }
      } else if (f.type === 'urn') {
        f.st -= dt; if (f.st <= 0 && foes.filter((o) => !o.dead).length < 22) { f.st = 3.2; const m = spawnFoe('moth', false, [f.x, f.y + 20]); m.spawnT = 0.3; m.hp = m.max = m.max * 0.6; E.burst(f.x, f.y, '#d4a373', 10, 120, 0.4, 3); }
      } else if (f.type === 'boss') bossAI(f, a, d, dt);
      pushOut(f);
      if (d < f.r + P.r && f.dmg) hurtPlayer(f.dmg, f.x, f.y);
    }
    // separation
    for (let i = 0; i < foes.length; i++) for (let j = i + 1; j < foes.length; j++) {
      const a = foes[i], b = foes[j]; if (a.dead || b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = a.r + b.r;
      if (d > 0 && d < m) { const o = (m - d) / 2, nx = dx / d, ny = dy / d; if (a.type !== 'boss' && a.type !== 'urn') { a.x -= nx * o; a.y -= ny * o; } if (b.type !== 'boss' && b.type !== 'urn') { b.x += nx * o; b.y += ny * o; } }
    }
    foes = foes.filter((f) => !f.dead);

    // --- enemy bolts ---
    for (let i = ebolts.length - 1; i >= 0; i--) {
      const b = ebolts[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < WALL || b.x > W - WALL || b.y < WALL || b.y > H - WALL || inPillar(b.x, b.y)) { E.burst(b.x, b.y, b.col, 4, 80, 0.2, 2); ebolts.splice(i, 1); continue; }
      if (alive && E.dist(b.x, b.y, P.x, P.y) < P.r + 5) { hurtPlayer(b.dmg, b.x, b.y); ebolts.splice(i, 1); }
    }

    // --- embers ---
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i]; e.t += dt; const d = E.dist(e.x, e.y, P.x, P.y);
      if (e.t > 0.4 && (d < P.magnet || doorOpen)) { const a = E.angTo(e.x, e.y, P.x, P.y), s = doorOpen ? 600 : 380; e.vx = Math.cos(a) * s; e.vy = Math.sin(a) * s; }
      e.vx *= Math.exp(-3 * dt); e.vy *= Math.exp(-3 * dt); e.x += e.vx * dt; e.y += e.vy * dt;
      if (alive && d < P.r + 8) { P.hp = Math.min(P.maxHp, P.hp + 3); E.sfx('coin', E.rand(0.9, 1.2)); embers.splice(i, 1); }
    }

    // --- room clear ---
    if (alive && phase === 'fight' && foes.length === 0) {
      P.hp = Math.min(P.maxHp, P.hp + 15); ebolts.length = 0; E.sfx('win'); E.shake(5);
      if (depth % 5 === 0) {
        // boss cleared: natural break, offer midgame ad then boon
        E.setState('menu'); setTimeout(() => E.sdk.midgame(offerBoons), 1200);
      } else setTimeout(offerBoons, 700);
      phase = 'cleared';
    }
    if (alive && phase === 'door') {
      doorOpen = true;
      if (P.y < WALL + 30 && Math.abs(P.x - W / 2) < 50) { E.sfx('select'); nextRoom(); }
    }
  };

  function bossAI(f, a, d, dt) {
    const enraged = f.hp < f.max * 0.5;
    f.st -= dt;
    if (f.state === 'idle') {
      f.x += Math.cos(a) * f.spd * dt; f.y += Math.sin(a) * f.spd * dt;
      if (f.st <= 0) { f.state = E.pick(['ring', 'charge', 'spiral', 'summon']); f.st = 0; f.n = 0; }
    } else if (f.state === 'ring') {
      if (f.st <= 0) { const n = enraged ? 22 : 16, off = f.n * 0.13; for (let i = 0; i < n; i++) eShoot(f.x, f.y, (i / n) * 6.283 + off, 150, '#ffcc80', 14); f.n++; f.st = 0.5; E.shake(4); E.sfx('thud'); if (f.n >= (enraged ? 4 : 3)) { f.state = 'idle'; f.st = 1.4; } }
    } else if (f.state === 'charge') {
      if (!f.ca) { f.ca = a; f.st = 0.7; f.sub = 'wind'; }
      if (f.sub === 'wind') { f.x += E.rand(-2, 2); if (f.st <= 0) { f.sub = 'go'; f.st = 0.8; E.sfx('dash'); } }
      else { f.x += Math.cos(f.ca) * 480 * dt; f.y += Math.sin(f.ca) * 480 * dt; if (f.st <= 0 || f.x <= WALL + f.r + 1 || f.x >= W - WALL - f.r - 1 || f.y <= WALL + f.r + 1 || f.y >= H - WALL - f.r - 1) { E.shake(12); E.sfx('explode'); for (let i = 0; i < 10; i++) eShoot(f.x, f.y, (i / 10) * 6.283, 200, '#ff7043', 14); f.ca = 0; f.state = 'idle'; f.st = 1.2; } }
    } else if (f.state === 'spiral') {
      if (f.st <= 0) { f.st = enraged ? 0.05 : 0.08; f.n++; eShoot(f.x, f.y, f.n * 0.35, 190, '#fff59d', 12); eShoot(f.x, f.y, f.n * 0.35 + Math.PI, 190, '#fff59d', 12); if (f.n > 50) { f.state = 'idle'; f.st = 1.3; } }
    } else if (f.state === 'summon') {
      for (let i = 0; i < (enraged ? 5 : 3); i++) { const m = spawnFoe('moth', false, [f.x + E.rand(-60, 60), f.y + E.rand(-60, 60)]); m.spawnT = 0.5; }
      f.state = 'idle'; f.st = 1.8;
    }
  }

  function eShoot(x, y, a, s, col, dmg = 10) { ebolts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 4, col, dmg: dmg + depth * 0.6 }); E.sfx('laser', 0.6); }

  function demoUpdate(dt) {
    for (const f of foes) { f.t += dt; f.x += Math.cos(f.t * 0.7 + f.r) * 40 * dt; f.y += Math.sin(f.t * 0.9) * 30 * dt; pushOut(f); }
  }

  // ---------------- drawing ----------------
  function drawFloor(c) {
    c.fillStyle = '#33222b'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(255,200,150,0.12)'; c.lineWidth = 2;
    for (let x = WALL; x < W; x += 48) for (let y = WALL; y < H; y += 48) { c.strokeRect(x + ((y / 48) % 2) * 24, y, 48, 48); }
    // runes
    c.fillStyle = 'rgba(255,120,60,0.06)'; c.beginPath(); c.arc(W / 2, H / 2, 120, 0, 7); c.fill();
    c.fillStyle = '#2a1a22'; c.fillRect(0, 0, W, WALL); c.fillRect(0, H - WALL, W, WALL); c.fillRect(0, 0, WALL, H); c.fillRect(W - WALL, 0, WALL, H);
    c.fillStyle = '#3d2530'; for (let x = 0; x < W; x += 32) { c.fillRect(x, WALL - 6, 28, 6); c.fillRect(x, H - WALL, 28, 6); }
    // door
    c.fillStyle = doorOpen ? '#ffcc66' : '#4a2c38'; c.fillRect(W / 2 - 44, 0, 88, WALL);
    if (doorOpen) { E.glow(c, '#ffaa33', 30); c.fillRect(W / 2 - 44, 0, 88, WALL); E.noGlow(c); }
    for (const p of pillars) {
      c.fillStyle = '#4a3340'; c.fillRect(p.x, p.y, p.w, p.h);
      c.fillStyle = '#6b4a5a'; c.fillRect(p.x, p.y, p.w, 8);
      c.strokeStyle = '#1a1015'; c.lineWidth = 3; c.strokeRect(p.x, p.y, p.w, p.h);
    }
  }

  function drawFoe(c, f) {
    c.save(); c.translate(f.x, f.y);
    if (f.spawnT > 0) { c.globalAlpha = 1 - f.spawnT / 0.6; c.scale(1 - f.spawnT, 1 - f.spawnT); }
    const col = f.flash > 0 ? '#fff' : f.col;
    c.fillStyle = col;
    if (f.type === 'moth') {
      const flap = Math.sin(f.t * 20) * 0.6 + 0.8;
      c.beginPath(); c.ellipse(-8, 0, 9 * flap, 6, 0.4, 0, 7); c.ellipse(8, 0, 9 * flap, 6, -0.4, 0, 7); c.fill();
      c.fillStyle = '#3b2a55'; c.beginPath(); c.ellipse(0, 0, 3, 8, 0, 0, 7); c.fill();
    } else if (f.type === 'caster') {
      c.beginPath(); c.moveTo(0, -16); c.lineTo(13, 12); c.lineTo(-13, 12); c.closePath(); c.fill();
      c.fillStyle = '#062d3a'; c.beginPath(); c.arc(0, -2, 6, 0, 7); c.fill();
      c.fillStyle = '#bff6ff'; c.beginPath(); c.arc(Math.cos(E.angTo(f.x, f.y, P.x, P.y)) * 2, -2, 2.5, 0, 7); c.fill();
    } else if (f.type === 'brute') {
      if (f.state === 'wind') c.translate(E.rand(-2, 2), 0);
      c.beginPath(); c.roundRect(-20, -18, 40, 36, 8); c.fill();
      c.fillStyle = '#3a130a'; c.fillRect(-12, -6, 8, 6); c.fillRect(4, -6, 8, 6);
      if (f.state === 'wind') { c.strokeStyle = 'rgba(255,80,40,.6)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(f.ca) * 120, Math.sin(f.ca) * 120); c.stroke(); }
    } else if (f.type === 'urn') {
      c.beginPath(); c.moveTo(-12, -18); c.lineTo(12, -18); c.lineTo(18, 6); c.lineTo(10, 18); c.lineTo(-10, 18); c.lineTo(-18, 6); c.closePath(); c.fill();
      c.fillStyle = '#5b3a1e'; c.fillRect(-14, -2, 28, 5);
    } else if (f.type === 'boss') {
      const pulse = 1 + Math.sin(f.t * 4) * 0.04; c.scale(pulse, pulse);
      if (f.sub === 'wind' && f.state === 'charge') c.translate(E.rand(-3, 3), 0);
      c.beginPath(); c.moveTo(-40, 40); c.quadraticCurveTo(-50, -10, -26, -44); c.lineTo(26, -44); c.quadraticCurveTo(50, -10, 40, 40); c.closePath(); c.fill();
      c.fillStyle = '#8d5524'; c.fillRect(-4, -62, 8, 20);
      c.fillStyle = '#fff3c4'; E.glow(c, '#ffaa00', 20); c.beginPath(); c.ellipse(0, -68, 8, 14 + Math.sin(f.t * 15) * 3, 0, 0, 7); c.fill(); E.noGlow(c);
      c.fillStyle = '#3e2412'; c.beginPath(); c.arc(-14, -10, 7, 0, 7); c.arc(14, -10, 7, 0, 7); c.fill();
      c.fillStyle = f.hp < f.max * 0.5 ? '#ff3d00' : '#ffb74d'; c.beginPath(); c.arc(-14, -10, 3, 0, 7); c.arc(14, -10, 3, 0, 7); c.fill();
    }
    c.restore();
    if (f.burn > 0) { c.fillStyle = 'rgba(255,90,0,.5)'; c.beginPath(); c.arc(f.x, f.y - f.r - 4, 3, 0, 7); c.fill(); }
    if (f.type !== 'boss' && f.hp < f.max) E.bar(c, f.x - 14, f.y - f.r - 10, 28, 4, f.hp / f.max, '#ff6b6b');
  }

  function drawPlayer(c) {
    if (!P || P.hp <= 0) return;
    if (P.inv > 0 && Math.floor(P.inv * 20) % 2 === 0) return;
    const fl = 1 + Math.sin(P.flick * 18) * 0.08, k = 0.6 + 0.4 * (P.hp / P.maxHp);
    c.save(); c.translate(P.x, P.y);
    E.glow(c, '#ff9900', 25);
    c.fillStyle = '#ff6a00'; c.beginPath(); c.moveTo(0, -24 * fl * k); c.quadraticCurveTo(14, -4, 10, 8); c.quadraticCurveTo(0, 16, -10, 8); c.quadraticCurveTo(-14, -4, 0, -24 * fl * k); c.fill();
    c.fillStyle = '#ffd54f'; c.beginPath(); c.moveTo(0, -14 * fl * k); c.quadraticCurveTo(8, -2, 6, 6); c.quadraticCurveTo(0, 11, -6, 6); c.quadraticCurveTo(-8, -2, 0, -14 * fl * k); c.fill();
    E.noGlow(c);
    c.fillStyle = '#3b1d00'; c.fillRect(-4 + P.fx * 2, -1 + P.fy * 2, 2.5, 3.5); c.fillRect(2 + P.fx * 2, -1 + P.fy * 2, 2.5, 3.5);
    c.restore();
    for (let k2 = 0; k2 < P.wisps; k2++) {
      const a = E.t * 3 + (k2 / P.wisps) * Math.PI * 2;
      c.fillStyle = '#ffe082'; E.glow(c, '#ffcc00', 12); c.beginPath(); c.arc(P.x + Math.cos(a) * 46, P.y + Math.sin(a) * 46, 6, 0, 7); c.fill(); E.noGlow(c);
    }
  }

  G.draw = (c) => {
    drawFloor(c);
    for (const e of embers) { c.fillStyle = '#ffb300'; c.beginPath(); c.arc(e.x, e.y, 3 + Math.sin(e.t * 10), 0, 7); c.fill(); }
    for (const f of foes) drawFoe(c, f);
    drawPlayer(c);
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const b of bolts) { c.fillStyle = '#ffcc55'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill(); c.fillStyle = 'rgba(255,120,0,.4)'; c.beginPath(); c.arc(b.x - b.vx * 0.012, b.y - b.vy * 0.012, b.r * 1.6, 0, 7); c.fill(); }
    for (const b of ebolts) { c.fillStyle = b.col; c.beginPath(); c.arc(b.x, b.y, 6, 0, 7); c.fill(); }
    c.restore();
    E.drawParts(c);
    // darkness
    const lr = P ? (110 + 160 * (P.hp / P.maxHp)) * (1 + Math.sin(E.t * 9) * 0.02) : 200;
    dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, W, H); dctx.fillStyle = 'rgba(5,2,6,0.9)'; dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';
    const light = (x, y, r, s = 1) => { const g = dctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(0,0,0,' + s + ')'); g.addColorStop(0.6, 'rgba(0,0,0,' + s * 0.7 + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = g; dctx.fillRect(x - r, y - r, r * 2, r * 2); };
    if (E.state === 'title') light(W / 2, H / 2, 420); else if (P && P.hp > 0) light(P.x, P.y, lr);
    for (const b of bolts) light(b.x, b.y, 50, 0.8);
    for (const b of ebolts) light(b.x, b.y, 30, 0.6);
    for (const f of foes) if (f.type === 'boss') light(f.x, f.y - 60, 140, 0.8);
    if (doorOpen) light(W / 2, 10, 120);
    c.drawImage(dark, 0, 0, W, H);
    E.drawTexts(c);
  };

  G.drawHud = (c) => {
    if (E.state === 'title' || !P) return;
    E.bar(c, 20, 18, 220, 16, P.hp / P.maxHp, P.hp / P.maxHp < 0.3 ? '#ff5252' : '#ffa726');
    c.strokeStyle = '#ffcc80'; c.lineWidth = 2; c.strokeRect(20, 18, 220, 16);
    E.text(c, 'FLAME ' + Math.ceil(P.hp) + '/' + P.maxHp, 26, 31, 12, '#1b0b00');
    E.text(c, 'ROOM ' + depth, 260, 32, 18, '#ffd27f');
    E.text(c, '🔥 ' + kills, 360, 32, 16, '#ffcc80');
    const dc = E.clamp(1 - P.dashCool / P.dashCd, 0, 1); E.bar(c, 20, 40, 100, 6, dc, dc >= 1 ? '#80d8ff' : '#567');
    const boss = foes.find((f) => f.type === 'boss');
    if (boss) { E.bar(c, W / 2 - 200, H - 26, 400, 12, boss.hp / boss.max, '#ff7043'); E.text(c, 'WAX COLOSSUS', W / 2, H - 32, 14, '#ffcc80', 'center'); }
    if (bannerT > 0 && banner) { c.globalAlpha = Math.min(1, bannerT); E.text(c, banner.t, W / 2, H / 2 - 60, 44, banner.c, 'center'); c.globalAlpha = 1; }
    if (phase === 'door' && E.state === 'play') E.text(c, '▲ The way deeper is open ▲', W / 2, 60, 18, '#ffe0a0', 'center');
    if (P.hp / P.maxHp < 0.25 && E.state === 'play') { c.fillStyle = 'rgba(255,0,0,' + (0.08 + Math.sin(E.t * 8) * 0.05) + ')'; c.fillRect(0, 0, W, H); }
  };

  G._dbg = { s: () => ({ foes, P, depth, phase, boons }), setDepth: (d) => (depth = d), killAll: () => foes.forEach((f) => (f.dead = true)) };
  E.start(G);
})();

</script>
