  function beat(){

      fetch('/api/presence', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({pid:pid}), keepalive:true})

<script>
// ===== Shared mini-engine (inlined into each game at build time) =====
(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.E = { W, H, t: 0, dt: 0, paused: false, state: 'title', muted: false });

  // ---------- storage ----------

    const c0 = Math.floor((o.x - o.r) / T), c1 = Math.floor((o.x + o.r) / T), r0 = Math.floor((o.y - OY - o.r) / T), r1 = Math.floor((o.y - OY + o.r) / T);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (!solid(c, r)) continue; const rx = c * T, ry = r * T + OY, cx = E.clamp(o.x, rx, rx + T), cy = E.clamp(o.y, ry, ry + T), dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
      if (d < o.r && d > 0) { o.x = cx + (dx / d) * o.r; o.y = cy + (dy / d) * o.r; }
    }
  }

  // ---------- flow ----------
  G.toTitle = () => {
    E.setState('title'); genLevel(Math.max(1, best));
    E.ui(`<h1>HUSHLINE</h1><div class="tag">Every vault has a blind spot. Find it.</div>
      <button id="bPlay">Start Heist</button>${best > 1 ? `<button id="bCont" class="sec">Continue from Vault ${best}</button>` : ''}
      <p class="hint">Move: WASD · Sneak (silent): Shift / SNEAK · Takedown from behind: Space / E / KO<br>Throw a pebble to distract: Click / THROW · Grab all 3 chips, then reach the hatch</p>`);
    E.on('bPlay', () => { totalScore = 0; startLevel(1); });
    if (best > 1) E.on('bCont', () => { totalScore = 0; startLevel(best); });
  };
  function startLevel(n) { level = n; genLevel(n); E.ui(null); E.setState('play'); say('VAULT ' + n + ' — ' + guards.length + ' guards' + (cams.length ? ', ' + cams.length + ' cameras' : ''), 2.5); }
  function say(s, t = 2) { msg = s; msgT = t; }

  function caught() {
    if (done) return; done = true; E.sfx('lose'); E.shake(12); E.flash('#ff1744', 0.4); E.setState('over');
    setTimeout(() => E.sdk.midgame(() => {
      E.ui(`<h2>Busted!</h2><div class="stats">Caught in Vault <b>${level}</b> · Heist score <b>${totalScore}</b><br>Best vault reached: ${best}</div>
        <button id="bRetry">Retry Vault ${level}</button><button id="bMenu" class="sec">Title</button>`);
      E.on('bRetry', () => startLevel(level)); E.on('bMenu', G.toTitle);
    }), 900);
  }
  function escape() {
    done = true; cleared = true; E.sfx('win'); E.sdk.happytime(); E.setState('menu');
    const ghost = spotted === 0, pts = 1000 + Math.max(0, Math.round(600 - time * 6)) + (ghost ? 1000 : 0) + kos * 150 + pebbles * 100;
    totalScore += pts;
    if (level + 1 > best) { best = level + 1; E.save('best', best); }
    const show = () => {
      E.ui(`<h2>${ghost ? 'GHOST!' : 'Clean getaway'}</h2><div class="stats">Vault ${level} cracked in ${time.toFixed(1)}s<br>Spotted ${spotted}× · Takedowns ${kos} · Pebbles left ${pebbles}<br>+${pts} · Heist score <b>${totalScore}</b></div>
        <button id="bNext">Next Vault</button><button id="bMenu" class="sec">Title</button>`);
      E.on('bNext', () => startLevel(level + 1)); E.on('bMenu', G.toTitle);
    };
    setTimeout(() => (level % 3 === 0 ? E.sdk.midgame(show) : show()), 800);
  }

  function makeNoise(x, y, rad, strong) {
    noises.push({ x, y, r: 0, max: rad, t: 0.5 });
    for (const g of guards) {
      if (g.ko || g.state === 'chase') continue;
      if (E.dist(g.x, g.y, x, y) < rad) { g.state = 'investigate'; g.tx = x; g.ty = y; g.path = pathTo(g.x, g.y, x, y); g.wait = 2.2; g.meter = Math.max(g.meter, strong ? 0.3 : 0.15); }
    }
  }

  G.update = (dt) => {
    for (const ch of chips) ch.t += dt;
    if (msgT > 0) msgT -= dt;
    for (let i = noises.length - 1; i >= 0; i--) { const n = noises[i]; n.t -= dt; n.r = n.max * (1 - n.t / 0.5); if (n.t <= 0) noises.splice(i, 1); }
    if (E.state === 'title') { for (const g of guards) guardAI(g, dt, true); return; }
    if (E.state !== 'play') return;
    time += dt;
    // player
    const m = E.input.move, inp = E.input;
    P.sneak = E.key('Shift') || inp.buttons.sneak;
    const spd = P.sneak ? 70 : 130;
    P.moving = !!(m.x || m.y);
    if (P.moving) { P.a = Math.atan2(m.y, m.x); P.x += m.x * spd * dt; P.y += m.y * spd * dt; P.step += dt * (P.sneak ? 4 : 8); }
    pushOut(P);
    if (P.moving && !P.sneak) { P.noiseT = (P.noiseT || 0) - dt; if (P.noiseT <= 0) { P.noiseT = 0.45; makeNoise(P.x, P.y, 75, false); } }
    // pebble throw
    if ((inp.mclick && !inp.touch) || E.hit('btn:throw') || E.hit('q')) {
      if (pebbles > 0) {
        let tx = inp.mx, ty = inp.my; if (inp.touch || E.hit('q')) { tx = P.x + Math.cos(P.a) * 170; ty = P.y + Math.sin(P.a) * 170; }
        const a = E.angTo(P.x, P.y, tx, ty), d = Math.min(260, E.dist(P.x, P.y, tx, ty));
        thrown.push({ x: P.x, y: P.y, sx: P.x, sy: P.y, tx: P.x + Math.cos(a) * d, ty: P.y + Math.sin(a) * d, k: 0, a }); pebbles--; E.sfx('dash');
      } else say('No pebbles left', 1);
    }
    for (let i = thrown.length - 1; i >= 0; i--) {
      const p = thrown[i]; p.k += dt * 2.6;
      const nx = E.lerp(p.sx, p.tx, Math.min(1, p.k)), ny = E.lerp(p.sy, p.ty, Math.min(1, p.k));
      if (solid(Math.floor(nx / T), Math.floor((ny - OY) / T))) p.k = 1; else { p.x = nx; p.y = ny; }
      if (p.k >= 1) { thrown.splice(i, 1); makeNoise(p.x, p.y, 200, true); E.sfx('thud', 2); E.burst(p.x, p.y, '#cfd8dc', 10, 100, 0.3, 2); }
    }
    // takedown
    if (E.hit(' ') || E.hit('e') || E.hit('btn:ko')) {
      const g = guards.find((g) => !g.ko && E.dist(g.x, g.y, P.x, P.y) < 34);
      if (g) {
        if (g.state !== 'chase' && !inCone(g, P.x, P.y, 1.2)) { g.ko = true; kos++; E.sfx('kill', 0.6); E.shake(6); E.hitstop(0.08); E.burst(g.x, g.y, '#ffe066', 18, 180, 0.5, 3); E.popText(g.x, g.y - 20, 'Lights out', '#ffe066', 14); makeNoise(g.x, g.y, 60, false); }
        else say('They see you coming!', 1);
      }
    }
    // chips & exit
    for (let i = chips.length - 1; i >= 0; i--) if (E.dist(chips[i].x, chips[i].y, P.x, P.y) < 18) { E.sfx('pickup'); E.burst(chips[i].x, chips[i].y, '#64ffda', 16, 160, 0.4, 3); chips.splice(i, 1); say(chips.length ? chips.length + ' chip' + (chips.length > 1 ? 's' : '') + ' left' : 'Hatch unlocked — get out!', 1.6); if (!chips.length) E.sfx('power'); }
    if (!chips.length && E.dist(tc(exitT[0]), tr(exitT[1]), P.x, P.y) < 18 && !done) return escape();
    for (const g of guards) guardAI(g, dt, false);
    for (const cm of cams) camAI(cm, dt);
    if (alarmT > 0) alarmT -= dt;
  };

  function inCone(g, x, y, range = 1) {
    const R = (g.state === 'chase' ? 230 : 175) * range, half = 0.62;
    const d = E.dist(g.x, g.y, x, y); if (d > R) return false;
    let da = Math.atan2(y - g.y, x - g.x) - g.a; da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > half && d > 26) return false;
    return los(g.x, g.y, x, y);
  }

  function moveAlong(g, dt, spd) {
    if (!g.path.length) return true;
    const [nx, ny] = g.path[0], a = E.angTo(g.x, g.y, nx, ny), d = E.dist(g.x, g.y, nx, ny);
    g.a = turn(g.a, a, dt * 6);
    if (d < spd * dt + 1) { g.x = nx; g.y = ny; g.path.shift(); } else { g.x += Math.cos(a) * spd * dt; g.y += Math.sin(a) * spd * dt; }
    g.bob += dt * spd * 0.12;
    return !g.path.length;
  }
  function turn(a, b, k) { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + E.clamp(d, -k, k); }

  function guardAI(g, dt, demo) {
    if (g.ko) return;
    const sees = !demo && E.state === 'play' && inCone(g, P.x, P.y);
    if (sees) {
      const d = E.dist(g.x, g.y, P.x, P.y);
      g.meter += dt * (2.6 - (d / 175) * 1.8) * (P.sneak ? 0.75 : 1) * (1 + level * 0.05);
      if (g.state !== 'chase' && g.meter >= 1) { g.state = 'chase'; spotted++; E.sfx('alert'); E.shake(4); say('SPOTTED! Break line of sight!', 1.5); }
      if (g.state !== 'chase') { g.a = turn(g.a, E.angTo(g.x, g.y, P.x, P.y), dt * 2.5); g.state = g.state === 'patrol' ? 'suspicious' : g.state; }
      g.lx = P.x; g.ly = P.y; g.lostT = 0;
    } else if (g.state !== 'chase') g.meter = Math.max(0, g.meter - dt * 0.35);

    if (g.state === 'patrol') {
      if (g.wait > 0) { g.wait -= dt; g.look += dt; g.a += Math.sin(g.look * 2) * dt * 1.4; return; }
      if (!g.path.length) { g.wi = (g.wi + 1) % g.wps.length; const [c, r] = g.wps[g.wi]; g.path = pathTo(g.x, g.y, tc(c), tr(r)); if (!g.path.length) g.wait = 1; }
      if (moveAlong(g, dt, g.spd)) g.wait = 1.2 + rng() * 1.2;
    } else if (g.state === 'suspicious') {
      if (!sees && g.meter <= 0.05) { g.state = 'patrol'; g.path = []; }
    } else if (g.state === 'investigate') {
      if (g.path.length) moveAlong(g, dt, g.spd * 1.3);
      else { g.wait -= dt; g.look += dt * 3; g.a += Math.sin(g.look) * dt * 2.5; if (g.wait <= 0) { g.state = 'patrol'; g.path = []; } }
    } else if (g.state === 'chase') {
      if (!sees) g.lostT += dt;
      g.repath = (g.repath || 0) - dt;
      if (g.repath <= 0) { g.repath = 0.25; g.path = pathTo(g.x, g.y, g.lx, g.ly); }
      if (sees && E.dist(g.x, g.y, P.x, P.y) < 60) { const a = E.angTo(g.x, g.y, P.x, P.y); g.a = a; g.x += Math.cos(a) * g.spd * 1.9 * dt; g.y += Math.sin(a) * g.spd * 1.9 * dt; pushOut(g); }
      else moveAlong(g, dt, g.spd * 1.9);
      if (g.lostT > 3) { g.state = 'investigate'; g.tx = g.lx; g.ty = g.ly; g.path = []; g.wait = 3; g.meter = 0.5; }
      if (E.dist(g.x, g.y, P.x, P.y) < g.r + P.r + 2) caught();
    }
  }

  function camAI(cm, dt) {
    cm.t += dt; cm.a = cm.base + Math.sin(cm.t * 0.8) * cm.sweep;
    const d = E.dist(cm.x, cm.y, P.x, P.y); let da = Math.atan2(P.y - cm.y, P.x - cm.x) - cm.a; da = Math.atan2(Math.sin(da), Math.cos(da));
    const sees = d < 190 && Math.abs(da) < 0.38 && los(cm.x, cm.y + 6, P.x, P.y);
    if (sees) { cm.meter += dt * 1.6; if (cm.meter >= 1) { cm.meter = 0; alarmT = 2; spotted++; E.sfx('alert'); say('CAMERA ALARM! Guards incoming!', 1.6); for (const g of guards) if (!g.ko) { g.state = 'investigate'; g.path = pathTo(g.x, g.y, P.x, P.y); g.wait = 3; } } }
    else cm.meter = Math.max(0, cm.meter - dt * 0.5);
  }

  // ---------- draw ----------
  function cone(c, x, y, a, half, R, col) {
    c.fillStyle = col; c.beginPath(); c.moveTo(x, y);
    const n = 18; for (let i = 0; i <= n; i++) { const aa = a - half + (2 * half * i) / n; const l = rayLen(x, y, aa, R); c.lineTo(x + Math.cos(aa) * l, y + Math.sin(aa) * l); }
    c.closePath(); c.fill();
  }
  G.draw = (c) => {
    c.fillStyle = '#05080a'; c.fillRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
      const x = cc * T, y = r * T + OY, v = map[r][cc];
      if (v === 1) { c.fillStyle = '#1f2a30'; c.fillRect(x, y, T, T); c.fillStyle = '#2f3f47'; c.fillRect(x, y, T, 6); }
      else { c.fillStyle = (r + cc) % 2 ? '#0f171b' : '#111a1f'; c.fillRect(x, y, T, T); if (v === 2) { c.fillStyle = '#4e3b2a'; c.fillRect(x + 4, y + 4, T - 8, T - 8); c.strokeStyle = '#6d5440'; c.lineWidth = 2; c.strokeRect(x + 6, y + 6, T - 12, T - 12); c.beginPath(); c.moveTo(x + 6, y + 6); c.lineTo(x + T - 6, y + T - 6); c.stroke(); } }
    }
    // exit hatch
    const ex = tc(exitT[0]), ey = tr(exitT[1]);
    c.save(); if (!chips.length) E.glow(c, '#69f0ae', 24); c.fillStyle = chips.length ? '#263238' : '#00e676'; c.fillRect(ex - 15, ey - 15, 30, 30); c.strokeStyle = chips.length ? '#455a64' : '#b9f6ca'; c.lineWidth = 3; c.strokeRect(ex - 15, ey - 15, 30, 30);
    c.fillStyle = '#000'; c.font = 'bold 14px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(chips.length ? '🔒' : '⇩', ex, ey + 1); E.noGlow(c); c.restore();
    // cones
    for (const g of guards) if (!g.ko) cone(c, g.x, g.y, g.a, 0.62, g.state === 'chase' ? 230 : 175, g.state === 'chase' ? 'rgba(255,60,60,.28)' : g.meter > 0.05 || g.state === 'investigate' ? 'rgba(255,170,40,.24)' : 'rgba(255,240,150,.14)');
    for (const cm of cams) cone(c, cm.x, cm.y + 6, cm.a, 0.38, 190, cm.meter > 0.05 ? 'rgba(255,80,80,.25)' : 'rgba(120,200,255,.13)');
    // noises
    for (const n of noises) { c.strokeStyle = 'rgba(200,220,255,' + n.t + ')'; c.lineWidth = 2; c.beginPath(); c.arc(n.x, n.y, n.r, 0, 7); c.stroke(); }
    // chips
    for (const ch of chips) { c.save(); c.translate(ch.x, ch.y + Math.sin(ch.t * 3) * 2); E.glow(c, '#64ffda', 16); c.fillStyle = '#64ffda'; c.fillRect(-8, -6, 16, 12); c.fillStyle = '#004d40'; c.fillRect(-4, -3, 8, 6); c.fillStyle = '#a7ffeb'; for (let i = -6; i <= 6; i += 4) { c.fillRect(i, -9, 2, 3); c.fillRect(i, 6, 2, 3); } E.noGlow(c); c.restore(); }
    for (const p of thrown) { const h = Math.sin(Math.min(1, p.k) * Math.PI) * 20; c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.arc(p.x, p.y, 3, 0, 7); c.fill(); c.fillStyle = '#cfd8dc'; c.beginPath(); c.arc(p.x, p.y - h, 4, 0, 7); c.fill(); }
    // cameras
    for (const cm of cams) { c.save(); c.translate(cm.x, cm.y); c.rotate(cm.a); c.fillStyle = '#90a4ae'; c.fillRect(-4, -6, 16, 12); c.fillStyle = cm.meter > 0.05 ? '#ff1744' : '#4fc3f7'; c.beginPath(); c.arc(12, 0, 3, 0, 7); c.fill(); c.restore(); }
    // guards
    for (const g of guards) {
      c.save(); c.translate(g.x, g.y);
      if (g.ko) { c.rotate(0.6); c.fillStyle = '#37474f'; c.beginPath(); c.ellipse(0, 0, 14, 8, 0, 0, 7); c.fill(); c.fillStyle = '#ffe066'; c.font = '12px sans-serif'; c.textAlign = 'center'; c.fillText('z', 10, -8 - Math.sin(E.t * 3) * 3); c.restore(); continue; }
      c.rotate(g.a);
      const sw = Math.sin(g.bob) * 3;
      c.fillStyle = '#263238'; c.fillRect(-6, -12 + sw, 8, 6); c.fillRect(-6, 6 - sw, 8, 6);
      c.fillStyle = g.state === 'chase' ? '#c62828' : '#455a64'; c.beginPath(); c.ellipse(0, 0, 9, 12, 0, 0, 7); c.fill();
      c.fillStyle = '#ffcc80'; c.beginPath(); c.arc(1, 0, 6, 0, 7); c.fill();
      c.fillStyle = '#212121'; c.fillRect(5, -2, 9, 4);
      c.restore();
      if (g.state === 'chase') E.text(c, '!', g.x, g.y - 18, 22, '#ff1744', 'center');
      else if (g.meter > 0.05 || g.state === 'investigate') { E.text(c, '?', g.x, g.y - 18, 18, '#ffab40', 'center'); if (g.meter > 0.05) E.bar(c, g.x - 12, g.y - 34, 24, 4, g.meter, '#ffab40'); }
    }
    // player
    if (E.state !== 'title') {
      c.save(); c.translate(P.x, P.y); c.rotate(P.a);
      const sw = P.moving ? Math.sin(P.step * 2) * 3 : 0;
      c.fillStyle = '#111'; c.fillRect(-5, -9 + sw, 7, 5); c.fillRect(-5, 4 - sw, 7, 5);
      c.fillStyle = P.sneak ? '#37474f' : '#546e7a'; c.beginPath(); c.ellipse(0, 0, 8, 10, 0, 0, 7); c.fill();
      c.fillStyle = '#ffe066'; c.beginPath(); c.arc(1, 0, 5.5, 0, 7); c.fill();
      c.fillStyle = '#263238'; c.beginPath(); c.arc(-1, 0, 5.5, Math.PI * 0.5, Math.PI * 1.5); c.fill();
      c.restore();
      const near = guards.find((g) => !g.ko && E.dist(g.x, g.y, P.x, P.y) < 34 && g.state !== 'chase' && !inCone(g, P.x, P.y, 1.2));
      if (near) E.text(c, E.input.touch ? 'KO!' : 'SPACE: takedown', near.x, near.y - 26, 12, '#ffe066', 'center');
    }
    E.drawParts(c); E.drawTexts(c);
    if (alarmT > 0) { c.fillStyle = 'rgba(255,0,0,' + (0.1 + Math.sin(E.t * 20) * 0.06) + ')'; c.fillRect(0, 0, W, H); }
  };

  G.drawHud = (c) => {
    if (E.state === 'title') return;
    c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, 0, 560, 30);
    E.text(c, 'VAULT ' + level, 10, 21, 16, '#ffe066');
    E.text(c, 'CHIPS ' + (3 - chips.length) + '/3', 110, 21, 16, '#64ffda');
    E.text(c, 'PEBBLES ' + pebbles, 230, 21, 16, '#cfd8dc');
    E.text(c, (spotted ? 'SPOTTED ' + spotted : 'GHOST') , 350, 21, 16, spotted ? '#ff8a80' : '#b9f6ca');
    E.text(c, time.toFixed(0) + 's', 480, 21, 16, '#fff');
    if (P.sneak) E.text(c, 'SNEAKING', P.x, P.y + 26, 11, '#b0bec5', 'center');
    if (msgT > 0) { c.globalAlpha = Math.min(1, msgT); E.text(c, msg, W / 2, H - 24, 20, '#fff', 'center'); c.globalAlpha = 1; }
  };

  G._dbg = { s: () => ({ P, guards, chips, cams, exitT, level, done }), grab: () => (chips.length = 0), go: startLevel };
  E.start(G);
})();

</script>
