  function beat(){

      fetch('/api/presence', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({pid:pid}), keepalive:true})

<script>
// ===== Shared mini-engine (inlined into each game at build time) =====
(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.E = { W, H, t: 0, dt: 0, paused: false, state: 'title', muted: false });

  // ---------- storage ----------
  // Progress (best score, unlocks, mute) is saved in the browser's localStorage.

  // ---------- game-flow hooks (no platform SDK; kept so game code can call them) ----------

    adPlaying: false,

<script>
// PULSE WARDEN — rhythm-action. Guard the beacon: strike the shapes that ride the beat in from four lanes.
(function () {
  const { W, H } = E;
  const G = { id: 'pulse-warden' };

  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // up right down left

    { n: 'Neon Pulse', bpm: 96, bars: 24, root: 55, dens: 0.55, approach: 1.7, feats: [], col: '#b388ff' },
    { n: 'Glass Rain', bpm: 108, bars: 26, root: 49, dens: 0.62, approach: 1.55, feats: ['double'], col: '#80d8ff' },
    { n: 'Iron Tide', bpm: 118, bars: 28, root: 58.27, dens: 0.62, approach: 1.45, feats: ['armor'], col: '#ffab40' },
    { n: 'Fever Gate', bpm: 128, bars: 30, root: 51.91, dens: 0.66, approach: 1.35, feats: ['armor', 'bomb', 'double'], col: '#ff4081' },
    { n: 'Last Signal', bpm: 140, bars: 32, root: 55, dens: 0.7, approach: 1.25, feats: ['armor', 'bomb', 'double', 'eighth'], col: '#69f0ae' },
  ];
  const SCALE = [0, 3, 5, 7, 10, 12, 15];
  const PROG = [[0, 3, 5, 3], [0, 5, 3, 7], [0, -2, 3, 5], [0, 3, -2, 5], [0, 5, 7, 3]];

  let song, si, notes, t0, clockBase, hp, score, combo, maxCombo, judge, counts, step, nextStepT, ended, strikes, shield, unlocked, best, beatPulse, overdrive, rng, laneFlash, perfLat;

  function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  G.init = () => {
    unlocked = E.load('unlocked', 1); best = E.load('best', {});
    E.touchButtons = [{ id: 'shield', label: 'SHIELD', x: W - 80, y: H - 80, r: 48, color: '#ff5252' }];

    E.setState('title'); notes = []; ended = true;

      <div class="row" style="max-width:900px">${list}</div>
      <p class="hint">Strike: Arrow keys / WASD, or click/tap the side the shape comes from · Red bombs: SHIELD (Space)<br>Armored shapes bounce back once — hit them again on the next beat. Headphones recommended.</p>`);

      const beat = 60 / song.bpm;

      E.popText(px, py - 20, 'CRACK!', '#ffab40', 16);

    if (combo > 0 && combo % 25 === 0) { overdrive = 8; E.sfx('power'); E.flash(song.col, 0.25); E.popText(CX, CY - 120, 'OVERDRIVE ×2', song.col, 26); }
  }

  function damage(n, amt) { hp -= amt; combo = 0; E.shake(8); E.flash('#ff1744', 0.2); E.sfx('hurt'); counts.miss++; judge = { j: 'miss', t: 0.5 }; if (hp <= 0 && !ended) finish(false); }

  function finish(cleared) {
    ended = true; E.setState('menu');
    const tot = counts.perfect + counts.great + counts.good + counts.miss || 1;
    const acc = (counts.perfect + counts.great * 0.7 + counts.good * 0.4) / tot;
    const grade = !cleared ? 'F' : acc > 0.95 ? 'S' : acc > 0.85 ? 'A' : acc > 0.7 ? 'B' : acc > 0.5 ? 'C' : 'D';
    if (cleared) {
      E.sfx('win'); E.sdk.happytime();
      if (si + 2 > unlocked) { unlocked = Math.min(SONGS.length, si + 2); E.save('unlocked', unlocked); }
      if (!best[si] || score > best[si].score) { best[si] = { score, grade }; E.save('best', best); }
    } else E.sfx('lose');
    setTimeout(() => E.sdk.midgame(() => {
      const next = cleared && si < SONGS.length - 1;
      E.ui(`<h2>${cleared ? 'Beacon held!' : 'Beacon dimmed'}</h2><div style="font-size:72px;font-weight:bold;color:${song.col};text-shadow:0 0 24px ${song.col}">${grade}</div>
        <div class="stats">${song.n} · Score <b>${score}</b> · Max combo ${maxCombo}<br>Perfect ${counts.perfect} · Great ${counts.great} · Good ${counts.good} · Miss ${counts.miss} · Accuracy ${(acc * 100).toFixed(1)}%</div>
        ${next ? '<button id="bNext">Next Track</button>' : ''}<button id="bRetry" class="${next ? 'sec' : ''}">Retry</button><button id="bMenu" class="sec">Tracks</button>`);
      if (next) E.on('bNext', () => startSong(si + 1));
      E.on('bRetry', () => startSong(si)); E.on('bMenu', G.toTitle);
    }), cleared ? 1200 : 600);
  }

  G.update = (dt) => {
    beatPulse = Math.max(0, (beatPulse || 0) - dt * 4);
    for (let i = 0; i < 4; i++) laneFlash[i] = Math.max(0, laneFlash[i] - dt);
    for (let i = strikes.length - 1; i >= 0; i--) { strikes[i].t -= dt; if (strikes[i].t <= 0) strikes.splice(i, 1); }
    if (E.state !== 'play') return;
    scheduleMusic();
    const t = now(), beat = 60 / song.bpm;
    const bf = (t / beat) % 1; if (t > 0 && bf < 0.08) beatPulse = 1;
    if (judge) { judge.t -= dt; if (judge.t <= 0) judge = null; }
    shield = Math.max(0, shield - dt); overdrive = Math.max(0, overdrive - dt);
    // input
    for (const k in KEYMAP) if (E.hit(k)) judgeHit(KEYMAP[k]);
    if (E.hit(' ') || E.hit('btn:shield') || E.hit('mouse2')) judgeHit(-1, true);
    if (E.input.mclick) {
      const dx = E.input.mx - CX, dy = E.input.my - CY;
      if (Math.hypot(dx, dy) > 20) { const a = Math.atan2(dy, dx); const lane = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0); judgeHit(lane); void a; }
    }
    // misses
    for (const n of notes) {
      if (n.hit || n.missed) continue;
      if (t - n.t > 0.16) {
        n.missed = true;
        const [dx, dy] = DIRS[n.lane];
        if (n.type === 'bomb') { damage(n, 14); E.sfx('explode'); E.burst(CX + dx * RING, CY + dy * RING, '#ff5252', 30, 300, 0.5, 4); }
        else { damage(n, 9); E.burst(CX + dx * RING, CY + dy * RING, '#888', 10, 150, 0.4, 3); }
      }
    }
    notes = notes.filter((n) => !(n.hit || n.missed) || t - n.t < 1);
    const songLen = song.bars * 4 * beat;
    if (!ended && t > songLen + 0.3) finish(true);
  };

  // keep audio clock frozen while paused
  function syncPause() {
    const ac = E.audio(); if (!ac) return;
    if (E.state === 'play' && E.paused && ac.state === 'running') { ac.suspend(); if (clockBase !== 'ac') {} }
    if (E.state === 'play' && !E.paused && ac.state === 'suspended') ac.resume();
  }
  // perf clock pause compensation
  let pausedAt = null;

  G.draw = (c) => {
    syncPause();
    if (clockBase === 'perf') { if (E.paused && pausedAt == null) pausedAt = performance.now() / 1000; if (!E.paused && pausedAt != null) { t0 += performance.now() / 1000 - pausedAt; pausedAt = null; } }
    const col = song.col, t = E.state === 'play' ? now() : E.t;
    const g = c.createRadialGradient(CX, CY, 10, CX, CY, 560); g.addColorStop(0, '#1a0f3a'); g.addColorStop(1, '#05030f');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // pulsing background polygons
    c.save(); c.translate(CX, CY);
    for (let k = 0; k < 6; k++) {
      const r = ((k * 90 + t * 60) % 540) + 20; c.strokeStyle = col; c.globalAlpha = (1 - r / 560) * (0.12 + beatPulse * 0.15); c.lineWidth = 2;
      c.beginPath(); for (let i = 0; i <= 6; i++) { const a = (i / 6) * 6.283 + t * 0.1; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.stroke();
    }
    c.globalAlpha = 1; c.restore();
    // lanes
    for (let l = 0; l < 4; l++) {
      const [dx, dy] = DIRS[l];
      c.strokeStyle = laneFlash[l] > 0 ? '#fff' : col; c.globalAlpha = 0.25 + laneFlash[l] * 2; c.lineWidth = 34;
      c.beginPath(); c.moveTo(CX + dx * RING, CY + dy * RING); c.lineTo(CX + dx * (FAR + 200), CY + dy * (FAR + 200)); c.stroke();
      c.globalAlpha = 0.6; c.lineWidth = 2; c.stroke();
      // hit marker
      c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(CX + dx * RING, CY + dy * RING, 18 + beatPulse * 4, 0, 7); c.stroke();
    }
    c.globalAlpha = 1;
    // notes
    if (E.state === 'play' || E.state === 'menu') {
      for (const n of notes) {
        if (n.hit || n.missed) continue;
        const app = song.approach * (n.bounced ? n.from : 1);
        const k = (n.t - t) / app; if (k > 1.05) continue;
        const dist = RING + Math.max(-0.2, k) * (n.bounced ? FAR * 0.55 : FAR);
        const [dx, dy] = DIRS[n.lane], x = CX + dx * dist, y = CY + dy * dist;
        c.save(); c.translate(x, y); c.rotate(t * 3 * (n.lane % 2 ? 1 : -1));
        if (n.type === 'bomb') { c.fillStyle = '#ff1744'; E.glow(c, '#ff1744', 18); c.beginPath(); c.arc(0, 0, 14, 0, 7); c.fill(); c.fillStyle = '#fff'; c.fillRect(-2, -10, 4, 13); c.fillRect(-2, 6, 4, 4); }
        else if (n.type === 'armor') { c.fillStyle = '#ffab40'; E.glow(c, '#ff6d00', 16); c.fillRect(-15, -15, 30, 30); c.fillStyle = '#4e2600'; c.fillRect(-8, -8, 16, 16); }
        else { c.fillStyle = n.bounced ? '#ffe0b2' : col; E.glow(c, col, 16); c.beginPath(); c.moveTo(0, -15); c.lineTo(15, 0); c.lineTo(0, 15); c.lineTo(-15, 0); c.closePath(); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 4, 0, 7); c.fill(); }
        E.noGlow(c); c.restore();
      }
    }
    // beacon / warden
    const pr = 30 + beatPulse * 8;
    c.save(); E.glow(c, overdrive > 0 ? '#fff' : col, 30 + beatPulse * 20);
    c.fillStyle = overdrive > 0 ? '#ffffff' : col; c.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * 6.283 + t * 0.5; c.lineTo(CX + Math.cos(a) * pr, CY + Math.sin(a) * pr); } c.closePath(); c.fill();
    c.fillStyle = '#100828'; c.beginPath(); c.arc(CX, CY, pr * 0.45, 0, 7); c.fill(); E.noGlow(c); c.restore();
    if (shield > 0) { c.strokeStyle = '#ff8a80'; c.globalAlpha = shield * 4; c.lineWidth = 6; c.beginPath(); c.arc(CX, CY, RING + 20, 0, 7); c.stroke(); c.globalAlpha = 1; }
    for (const s of strikes) {
      const [dx, dy] = DIRS[s.lane], k = s.t / 0.18, a = Math.atan2(dy, dx);
      c.save(); c.translate(CX, CY); c.rotate(a); c.globalAlpha = k; c.strokeStyle = '#fff'; c.lineWidth = 8 * k; E.glow(c, col, 20);
      c.beginPath(); c.arc(0, 0, RING, -0.6 + (1 - k) * 0.3, 0.6 - (1 - k) * 0.3); c.stroke(); c.restore();
    }
    E.drawParts(c); E.drawTexts(c);
  };

  G.drawHud = (c) => {
    if (E.state === 'title') return;
    E.text(c, song.n.toUpperCase(), 20, 32, 20, song.col);
    E.text(c, score.toString().padStart(7, '0'), W - 140, 32, 24, '#fff', 'right');
    E.bar(c, 20, 44, 200, 10, hp / 100, hp < 30 ? '#ff1744' : song.col); c.strokeStyle = '#fff'; c.lineWidth = 1; c.strokeRect(20, 44, 200, 10);
    const beat = 60 / song.bpm, len = song.bars * 4 * beat; E.bar(c, 0, H - 4, W, 4, E.state === 'play' ? now() / len : 1, 'rgba(255,255,255,.5)', 'rgba(0,0,0,.3)');
    if (combo >= 3) E.text(c, combo + ' COMBO', CX, CY + 130, 22 + Math.min(10, combo / 10), '#fff', 'center');
    if (overdrive > 0) E.text(c, 'OVERDRIVE', CX, CY - 110, 18, song.col, 'center');
    if (judge) { const col = { perfect: '#ffffff', great: '#69f0ae', good: '#ffd740', miss: '#ff5252' }[judge.j]; c.globalAlpha = Math.min(1, judge.t * 3); E.text(c, judge.j.toUpperCase(), CX, CY - 85, 22, col, 'center'); c.globalAlpha = 1; }
    if (E.state === 'play' && now() < 60 / song.bpm * 8) E.text(c, now() < 0 ? 'GET READY' : 'Arrows / WASD / tap a side to strike · Space = shield bombs', CX, H - 20, 16, '#fff', 'center');
  };

  G._dbg = { s: () => ({ notes, hp, score, combo, counts, t: now(), song }), autoplay: () => { const t = now(); for (const n of notes) if (!n.hit && !n.missed && Math.abs(n.t - t) < 0.03) judgeHit(n.type === 'bomb' ? -1 : n.lane, n.type === 'bomb'); }, end: () => finish(true) };
  E.start(G);
})();

</script>
