  explode: () => { E.tone({ noise: 1, f: 1400, f2: 60, d: 0.45, v: 0.3, filter: 'lowpass' }); E.tone({ f: 130, f2: 30, d: 0.3, type: 'sine', v: 0.35 }); },
  small: () => E.tone({ noise: 1, f: 2200, f2: 200, d: 0.15, v: 0.15, filter: 'lowpass' }),
  pickup: () => { E.tone({ f: 660, d: 0.08, type: 'triangle', v: 0.14 }); E.tone({ f: 990, d: 0.12, type: 'triangle', v: 0.14, delay: 0.06 }); },
  hurt: () => { E.tone({ f: 220, f2: 50, d: 0.4, type: 'sawtooth', v: 0.25 }); E.tone({ noise: 1, f: 700, d: 0.3, v: 0.22 }); },

const sfxCount = {};
E.sfx = (name, ...a) => {

let mus = null;
E.music = cfg => { mus = cfg ? Object.assign({ step: 0, next: 0 }, cfg) : null; };

  if (mus.next < ac.currentTime) mus.next = ac.currentTime + 0.05;
  while (mus.next < ac.currentTime + 0.2) {

/* ---------- juice: particles, rings, floating text, shake, hitstop ---------- */
const parts = [], rings = [], texts = [];

E.burst = (x, y, n, color, spd = 220, life = 0.6, size = 3) => {
  for (let i = 0; i < n; i++) {
    if (parts.length > 1000) parts.shift();
    const a = rand(TAU), s = rand(0.15, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, color, size: rand(0.6, 1.4) * size });
  }
};
E.spray = (x, y, ang, spread, n, color, spd = 260, life = 0.4, size = 2.5) => {
  for (let i = 0; i < n; i++) {
    if (parts.length > 1000) parts.shift();
    const a = ang + rand(-spread, spread), s = rand(0.3, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, color, size: rand(0.6, 1.4) * size });
  }
};
E.ring = (x, y, r, color, life = 0.4, w = 4) => rings.push({ x, y, r, color, life, max: life, w });
E.float = (x, y, str, color = '#fff', size = 22) => { if (texts.length < 40) texts.push({ x, y, str, color, size, life: 0.9 }); };
E.shake = a => { shakeAmt = Math.max(shakeAmt, a); };
E.hitstop = t => { hitstopT = Math.max(hitstopT, t); };
E.clearFx = () => { parts.length = rings.length = texts.length = 0; shakeAmt = 0; };
function updateFx(dt) {
  const fr = Math.pow(0.05, dt);
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= fr; p.vy *= fr; }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.life -= dt; if (r.life <= 0) rings.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const t = texts[i]; t.life -= dt; t.y -= 40 * dt; if (t.life <= 0) texts.splice(i, 1); }

  c.restore();
  for (const t of texts) { c.globalAlpha = clamp(t.life * 2, 0, 1); E.txt(c, t.str, t.x, t.y, t.size, t.color); }
  c.globalAlpha = 1;
}
const glowCache = {};
E.glow = (color, r) => {
  r = Math.max(2, Math.round(r)); const k = color + r; if (glowCache[k]) return glowCache[k];

};

function drawTouch(c) {
  c.save(); c.globalAlpha = 0.5; c.lineWidth = 3;
  const mv = sticks.move, am = sticks.aim;
  const stick = (s, hx, hy, col) => {
    const ox = s ? s.ox : hx, oy = s ? s.oy : hy;
    c.strokeStyle = col; c.beginPath(); c.arc(ox, oy, 70, 0, TAU); c.stroke();
    let kx = ox, ky = oy; if (s) { const dx = s.x - s.ox, dy = s.y - s.oy, l = Math.hypot(dx, dy); const m = Math.min(l, 70) / (l || 1); kx = ox + dx * m; ky = oy + dy * m; }
    c.fillStyle = col; c.beginPath(); c.arc(kx, ky, 28, 0, TAU); c.fill();
  };
  stick(mv, 170, H - 150, '#ffffff');
  if (GAME.aimStick !== false) stick(am, W - 260, H - 150, GAME.colors.a);

    c.beginPath(); c.arc(ACT.x, ACT.y, ACT.r, 0, TAU); c.fill(); c.stroke();

}

let last = performance.now(), fpsAcc = 0;

  try { musicTick(); } catch (e) { }
  if (pressed.KeyM) E.toggleMute();
  if (E.state === 'play') {
    E.playT += rdt;
    if (pressed.Escape || pressed.KeyP) E.pause();
    else if (hitstopT > 0) hitstopT -= rdt;
    else { E.dt = rdt * E.timeScale; GAME.update(E.dt); updateFx(E.dt); }
  } else if (E.state === 'pause') { if (pressed.Escape || pressed.KeyP) E.resume(); }
  else if (E.state === 'title') { if (GAME.attract) GAME.attract(rdt); updateFx(rdt); if (pressed.Enter) E.start(); }
  else if (E.state === 'over') { E.overT += rdt; updateFx(rdt); if (E.overT > 0.8 && pressed.Enter) playAgain(); }

  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = GAME.colors.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeAmt > 0 && E.state === 'play') ctx.translate(rand(-shakeAmt, shakeAmt), rand(-shakeAmt, shakeAmt));
  if (E.state !== 'loading') { GAME.draw(ctx); drawFx(ctx); }
  ctx.restore();
  if (E.state === 'play' || E.state === 'pause' || E.state === 'over') { GAME.hud(ctx); }
  if (E.state === 'play') { if (E.lastInput === 'touch' && !(GAME.hideTouch && GAME.hideTouch())) drawTouch(ctx); if (!(GAME.modal && GAME.modal())) drawPauseBtn(ctx); if (GAME.overlay) GAME.overlay(ctx); }
  else if (E.state === 'title') drawTitle(ctx);
  else if (E.state === 'pause') drawPause(ctx);
  else if (E.state === 'over') drawOver(ctx);
  else if (E.state === 'ad') { overlay(ctx, 0.8); E.txt(ctx, '...', W / 2, H / 2, 40, '#fff'); }
  else if (E.state === 'loading') { overlay(ctx, 1); E.txt(ctx, 'Loading…', W / 2, H / 2, 36, '#fff'); }

/* REPULSE — you have no weapon of your own. Hold your field to catch enemy fire in orbit,

  let P, held, shots, ebul, enemies, spawns, wave, score, combo, comboT, kills, slams, modal, waveState, waitT, toSpawn, spawnT, bannerT, up, wallFlash;
  const TYPES = {

    gunner: { r: 16, hp: 3, spd: 90, col: '#c77dff', pts: 150, mass: 1 },
    burster: { r: 19, hp: 5, spd: 60, col: '#4af0ff', pts: 250, mass: 1.3 },
    rammer: { r: 20, hp: 6, spd: 110, col: '#ff7b29', pts: 300, mass: 1.6 },
    bulwark: { r: 27, hp: 14, spd: 50, col: '#9dff4a', pts: 500, mass: 3 },
  };
  const UPS = [
    { id: 'cap', name: 'Deep Well', desc: 'Hold +6 more projectiles', f: () => up.cap += 6, max: 4 },
    { id: 'rad', name: 'Wide Field', desc: '+18% field radius', f: () => up.rad *= 1.18, max: 3 },
    { id: 'dmg', name: 'Hard Return', desc: 'Hurled shots deal +50%', f: () => up.dmg *= 1.5 },
    { id: 'regen', name: 'Dynamo', desc: '+35% energy regen', f: () => up.regen *= 1.35, max: 3 },
    { id: 'pulse', name: 'Cheap Thunder', desc: 'Pulse costs 25% less', f: () => up.pulseCost *= 0.75, max: 2 },
    { id: 'slam', name: 'Brickbreaker', desc: 'Wall & body slams +60% damage', f: () => up.slam *= 1.6 },
    { id: 'heal', name: 'Patch Up', desc: 'Restore 2 health', f: () => P.hp = Math.min(P.maxHp, P.hp + 2) },
    { id: 'max', name: 'Thick Hull', desc: '+1 max health', f: () => { P.maxHp++; P.hp++; }, max: 3 },
    { id: 'saw', name: 'Buzzsaw Orbit', desc: 'Held shots shred foes they touch', f: () => up.saw = true, max: 1 },
    { id: 'home', name: 'Seeker Return', desc: 'Hurled shots curve toward foes', f: () => up.home += 1, max: 2 },
  ];
  const taken = {};
  function reset() {
    P = { x: W / 2, y: H / 2, r: 14, hp: 4, maxHp: 4, inv: 0, en: 100, field: false, fieldT: 0, regenDelay: 0, a: 0, vx: 0, vy: 0 };
    up = { cap: 10, rad: 1, dmg: 1, regen: 1, pulseCost: 1, slam: 1, saw: false, home: 0 };

    held = []; shots = []; ebul = []; enemies = []; spawns = [];
    wave = 0; score = 0; combo = 1; comboT = 0; kills = 0; slams = 0; modal = null; wallFlash = [0, 0, 0, 0];
    startWave();
  }
  function startWave() {
    wave++; waveState = 'fight'; bannerT = 2; toSpawn = [];
    const n = 5 + wave * 3;
