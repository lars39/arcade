  }

  var every = home ? 30000 : 60000, last = 0;
  function beat(){
    if (document.hidden) return;

    try {
      fetch('/api/presence', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({pid:pid}), keepalive:true})

<script>

(function () {
  'use strict';
  const W = 960, H = 540;
  const E = (window.E = { W, H, t: 0, dt: 0, paused: false, state: 'title', muted: false });

  }
  function win() {
    done = true; E.sfx('win'); E.flash('#fff', 0.3); E.sdk.happytime();
    const par = LEVELS[lvl].par, s = time <= par ? 3 : time <= par * 1.6 ? 2 : 1;
    if ((stars[lvl] || 0) < s) { stars[lvl] = s; E.save('stars', stars); }
    if (lvl + 2 > unlocked) { unlocked = Math.min(LEVELS.length, lvl + 2); E.save('unlocked', unlocked); }
    completedCount++;
    E.setState('menu');
    const show = () => {
      const last = lvl === LEVELS.length - 1;
      const total = Object.values(stars).reduce((a, b) => a + b, 0);
      E.ui(`<h2>${last ? 'All locks broken!' : 'Level clear!'}</h2><div style="font-size:54px;color:#ffd740;text-shadow:0 0 20px #ffab00">${'★'.repeat(s)}${'☆'.repeat(3 - s)}</div>
        <div class="stats">Time ${time.toFixed(1)}s · Par ${par}s${last ? `<br>Total stars: ${total}/${LEVELS.length * 3}` : ''}</div>
        ${last ? '' : '<button id="bNext">Next Level</button>'}<button id="bRetry" class="sec">Replay</button><button id="bSel" class="sec">Levels</button>`);
      if (!last) E.on('bNext', () => startLevel(lvl + 1));
      E.on('bRetry', () => startLevel(lvl)); E.on('bSel', levelSelect);
    };
    setTimeout(() => (completedCount % 3 === 0 ? E.sdk.midgame(show) : show()), 900);
  }

  let mouseMode = true, lastMx = 0, lastMy = 0;
  G.update = (dt) => {
    for (const c of crystals) c.t += dt;
    for (const g of gates) g.a = E.lerp(g.a, g.open ? 0 : 1, dt * 12);
    if (E.state === 'title') { // demo: anchor circles
      A.x = W / 2 + Math.cos(E.t * 1.5) * 160; A.y = H / 2 + 40 + Math.sin(E.t * 3) * 60; physics(dt, false); return;
    }
    if (E.state !== 'play') { if (E.state === 'over' || E.state === 'menu') physics(dt, false); return; }
    if (E.hit('r')) return startLevel(lvl);
    time += dt; hintT -= dt; A.inv -= dt;
    // input
    const m = E.input.move, inp = E.input;
    if (Math.abs(inp.mx - lastMx) + Math.abs(inp.my - lastMy) > 2) mouseMode = true;
    lastMx = inp.mx; lastMy = inp.my;
    if (m.x || m.y) mouseMode = false;
    const MAXS = 330;
    let tvx, tvy;
    if (!mouseMode || (inp.touch && !inp.fire && !(m.x || m.y))) {
      if (inp.touch && !inp.fire) { tvx = 0; tvy = 0; } else { tvx = m.x * MAXS; tvy = m.y * MAXS; }
    } else {
      const dx = inp.aimX - A.x, dy = inp.aimY - A.y, d = Math.hypot(dx, dy);
      const s = Math.min(MAXS, d * 8); tvx = d > 1 ? (dx / d) * s : 0; tvy = d > 1 ? (dy / d) * s : 0;
    }
    A.vx = E.lerp(A.vx, tvx, Math.min(1, dt * 14)); A.vy = E.lerp(A.vy, tvy, Math.min(1, dt * 14));
    A.x += A.vx * dt; A.y += A.vy * dt; collide(A, 0);
    const reel = E.key(' ') || inp.rdown || inp.buttons.reel || (!inp.touch && inp.mdown);
    tlen = E.lerp(tlen, reel ? 48 : 104, dt * (reel ? 9 : 4));
    if (reel) reelT += dt; else reelT = 0;
    physics(dt, true);

    // hazards
    const ac = Math.floor(A.x / T), ar = Math.floor((A.y - OY) / T);
    if (grid[ar] && grid[ar][ac] === 2) hurt();
    // foes
    for (const f of foes) {
      if (f.dead) continue; f.t += dt;
      if (f.type === 'turret') {
        f.cd -= dt;
        if (f.cd <= 0 && E.dist(f.x, f.y, A.x, A.y) < 520) { f.cd = 2.2; const a = E.angTo(f.x, f.y, A.x, A.y); bullets.push({ x: f.x, y: f.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 5 }); E.sfx('laser', 0.7); }
      } else if (f.type === 'mine') {
        const nx = f.x + f.dir * 90 * dt, c = Math.floor((nx + f.dir * f.r) / T), r = Math.floor((f.y - OY) / T);
        if (solidAt(c, r) || grid[r][c] === 2) f.dir *= -1; else f.x = nx;
        if (E.dist(f.x, f.y, A.x, A.y) < f.r + A.r) hurt();
      }
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
      if (solidAt(Math.floor(b.x / T), Math.floor((b.y - OY) / T))) { E.burst(b.x, b.y, '#ff8a65', 5, 90, 0.2, 2); bullets.splice(i, 1); continue; }
      if (E.dist(b.x, b.y, F.x, F.y) < F.r + b.r) { E.burst(b.x, b.y, '#ffd180', 8, 140, 0.25, 2); E.sfx('blip'); bullets.splice(i, 1); continue; }
      if (E.dist(b.x, b.y, A.x, A.y) < A.r + b.r) { hurt(); bullets.splice(i, 1); }
    }
    if (!done && crystals.length === 0) win();
  };

  function physics(dt, live) {
    // sub-stepped rope physics for the star
    const steps = 4, h = dt / steps;
    for (let s = 0; s < steps; s++) {
      F.vy += 0; // top-down: no gravity
      const dx = F.x - A.x, dy = F.y - A.y, d = Math.hypot(dx, dy) || 1;
      if (d > tlen) { // taut rope: spring + remove outward velocity
        const nx = dx / d, ny = dy / d, ext = d - tlen;
        F.vx -= nx * ext * 60 * h; F.vy -= ny * ext * 60 * h;
        const vr = (F.vx - A.vx) * nx + (F.vy - A.vy) * ny; if (vr > 0) { F.vx -= nx * vr * 0.5; F.vy -= ny * vr * 0.5; }
      }
      const damp = Math.exp(-0.5 * h); F.vx *= damp; F.vy *= damp;
      F.x += F.vx * h; F.y += F.vy * h;
      const n = collide(F, 0.55);
      if (n && live && -n.vn > 140) { E.sfx('thud', 1 + Math.min(1, -n.vn / 600)); E.shake(Math.min(6, -n.vn / 120)); E.burst(F.x - n.nx * F.r, F.y - n.ny * F.r, '#ffe0f0', 6, 150, 0.3, 2); }
    }
    const spd = Math.hypot(F.vx, F.vy);
    trail.push({ x: F.x, y: F.y, s: spd }); if (trail.length > 14) trail.shift();
    if (!live) return;
    // star hits
    for (let i = crystals.length - 1; i >= 0; i--) {
      const c = crystals[i]; if (E.dist(F.x, F.y, c.x, c.y) > F.r + c.r) continue;
      const need = c.heavy ? 560 : 260;
      if (spd >= need) {
        crystals.splice(i, 1); E.sfx('explode'); E.sfx('kill', c.heavy ? 0.7 : 1.3); E.shake(c.heavy ? 12 : 6); E.hitstop(c.heavy ? 0.08 : 0.04);
        E.burst(c.x, c.y, c.heavy ? '#ffd740' : '#80d8ff', 34, 380, 0.7, 4); E.popText(c.x, c.y - 20, c.heavy ? 'SHATTER!' : 'SMASH', c.heavy ? '#ffd740' : '#80d8ff', 18);
      } else if (c.hit <= 0) {
        c.hit = 0.3; E.sfx('blip', 2); const a = E.angTo(c.x, c.y, F.x, F.y); F.vx = Math.cos(a) * 160; F.vy = Math.sin(a) * 160;
        E.popText(c.x, c.y - 20, 'Faster!', '#ff80ab', 14);
      }
    }
    for (const c of crystals) c.hit -= dt;
    for (const f of foes) {
      if (f.dead || E.dist(F.x, F.y, f.x, f.y) > F.r + f.r) continue;
      if (spd >= 220) { f.dead = true; E.sfx('explode'); E.shake(8); E.burst(f.x, f.y, f.type === 'mine' ? '#ff5252' : '#ff8a65', 30, 300, 0.6, 4); E.popText(f.x, f.y - 20, 'WRECKED', '#ff8a65', 16); }
    }
    for (const sw of switches) {
      sw.cd -= dt;
      if (sw.cd <= 0 && E.dist(F.x, F.y, sw.x, sw.y) < F.r + sw.r && spd > 120) {
        sw.cd = 0.6; for (const g of gates) g.open = !g.open; E.sfx('power'); E.shake(4); E.burst(sw.x, sw.y, '#69f0ae', 20, 200, 0.4, 3);
        for (const g of gates) if (!g.open) { const gx = g.c * T + T / 2, gy = g.r * T + T / 2 + OY; if (E.dist(A.x, A.y, gx, gy) < 30) { A.x += 1; } }
      }
    }
  }

  // ---------- draw ----------
  G.draw = (c) => {
    c.fillStyle = '#160b1f'; c.fillRect(0, 0, W, H);
    for (let r = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++) {
      const x = cc * T, y = r * T + OY, v = grid[r][cc];
      if (v === 1) { c.fillStyle = '#3a1f4d'; c.fillRect(x, y, T, T); c.fillStyle = '#56306f'; c.fillRect(x, y, T, 5); c.fillStyle = '#26133a'; c.fillRect(x, y + T - 4, T, 4); }
      else { c.fillStyle = (r + cc) % 2 ? '#1d1029' : '#21122e'; c.fillRect(x, y, T, T); }
      if (v === 2) { c.fillStyle = '#ff1744'; for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(x + 4 + k * 12, y + 34); c.lineTo(x + 10 + k * 12, y + 8); c.lineTo(x + 16 + k * 12, y + 34); c.fill(); } }
    }
    for (const g of gates) {
      const x = g.c * T, y = g.r * T + OY;
      c.strokeStyle = 'rgba(105,240,174,.35)'; c.strokeRect(x + 2, y + 2, T - 4, T - 4);
      if (g.a > 0.05) { c.globalAlpha = g.a; c.fillStyle = '#00e676'; E.glow(c, '#00e676', 12); for (let k = 0; k < 4; k++) c.fillRect(x + 4 + k * 9, y + 2, 5, T - 4); E.noGlow(c); c.globalAlpha = 1; }
    }
    for (const sw of switches) { c.fillStyle = sw.cd > 0 ? '#b9f6ca' : '#00c853'; E.glow(c, '#69f0ae', 14); c.beginPath(); c.arc(sw.x, sw.y, sw.r, 0, 7); c.fill(); E.noGlow(c); c.fillStyle = '#003d1a'; c.font = 'bold 14px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('⇄', sw.x, sw.y + 1); }
    for (const k of crystals) {
      c.save(); c.translate(k.x, k.y + Math.sin(k.t * 2) * 2); c.rotate(Math.sin(k.t) * 0.1);
      const col = k.heavy ? '#ffd740' : '#80d8ff'; E.glow(c, col, 18); c.fillStyle = k.hit > 0 ? '#fff' : col;
      c.beginPath(); c.moveTo(0, -16); c.lineTo(11, -2); c.lineTo(6, 14); c.lineTo(-6, 14); c.lineTo(-11, -2); c.closePath(); c.fill(); E.noGlow(c);
      c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(0, -12); c.lineTo(5, -2); c.lineTo(0, 8); c.closePath(); c.fill();
      if (k.heavy) { c.strokeStyle = '#ff6f00'; c.lineWidth = 2; c.stroke(); }
      c.restore();
    }
    for (const f of foes) {
      if (f.dead) continue;
      c.save(); c.translate(f.x, f.y);
      if (f.type === 'turret') { c.fillStyle = '#4e342e'; c.beginPath(); c.arc(0, 0, 15, 0, 7); c.fill(); c.rotate(E.angTo(f.x, f.y, A.x, A.y)); c.fillStyle = '#ff7043'; c.fillRect(0, -4, 18, 8); c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill(); c.fillStyle = f.cd < 0.5 ? '#fff' : '#ffccbc'; c.beginPath(); c.arc(0, 0, 4, 0, 7); c.fill(); }
      else { c.rotate(f.t * 4); c.fillStyle = '#ff5252'; E.glow(c, '#ff1744', 10); for (let k = 0; k < 8; k++) { c.rotate(Math.PI / 4); c.fillRect(-2, -15, 4, 8); } c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill(); E.noGlow(c); }
      c.restore();
    }
    for (const b of bullets) { c.fillStyle = '#ff9e80'; E.glow(c, '#ff3d00', 10); c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill(); E.noGlow(c); }
    // tether
    const taut = E.dist(A.x, A.y, F.x, F.y) >= tlen * 0.98;
    c.strokeStyle = taut ? '#ffb3d1' : 'rgba(255,179,209,.6)'; c.lineWidth = taut ? 3 : 2;
    c.beginPath(); c.moveTo(A.x, A.y);
    if (!taut) { const mx = (A.x + F.x) / 2, my = (A.y + F.y) / 2 + 10; c.quadraticCurveTo(mx, my, F.x, F.y); } else c.lineTo(F.x, F.y);
    c.stroke();
    // trail
    c.save(); c.globalCompositeOperation = 'lighter';
    trail.forEach((p, i) => { const k = i / trail.length; const fast = p.s > 560 ? '#ffd740' : p.s > 260 ? '#ff4f9a' : '#7b5a8a'; c.globalAlpha = k * 0.5; c.fillStyle = fast; c.beginPath(); c.arc(p.x, p.y, F.r * k, 0, 7); c.fill(); });
    c.restore();
    // star
    const spd = Math.hypot(F.vx, F.vy), sc = spd > 560 ? '#ffd740' : spd > 260 ? '#ff4f9a' : '#ce93d8';
    c.save(); c.translate(F.x, F.y); c.rotate(E.t * (2 + spd / 60)); E.glow(c, sc, spd > 260 ? 22 : 8); c.fillStyle = sc;
    c.beginPath(); for (let i = 0; i < 10; i++) { const a = (i / 10) * 6.283, r = i % 2 ? 7 : F.r + 3; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); E.noGlow(c);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 4, 0, 7); c.fill(); c.restore();
    // anchor
    if (!(A.inv > 0 && Math.floor(A.inv * 16) % 2)) {
      c.fillStyle = '#ffffff'; E.glow(c, '#ff4f9a', 14); c.beginPath(); c.arc(A.x, A.y, A.r, 0, 7); c.fill(); E.noGlow(c);
      c.strokeStyle = '#ff4f9a'; c.lineWidth = 3; c.beginPath(); c.arc(A.x, A.y, A.r - 3, 0, 7); c.stroke();
    }
    E.drawParts(c); E.drawTexts(c);
  };

  G.drawHud = (c) => {
    if (E.state === 'title') return;
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 0, W, OY);
    E.text(c, (lvl + 1) + '. ' + LEVELS[lvl].n, 8, 16, 14, '#ff9ccc');
    E.text(c, '❤'.repeat(Math.max(0, hp)) + '♡'.repeat(Math.max(0, 3 - hp)), 280, 16, 14, '#ff4f9a');
    E.text(c, '◆ ' + crystals.length + ' left', 380, 16, 14, '#80d8ff');
    E.text(c, time.toFixed(1) + 's / par ' + LEVELS[lvl].par + 's', 520, 16, 14, time <= LEVELS[lvl].par ? '#b9f6ca' : '#ffab91');
    const spd = Math.hypot(F.vx, F.vy); E.bar(c, 720, 6, 110, 8, spd / 700, spd > 560 ? '#ffd740' : spd > 260 ? '#ff4f9a' : '#9575cd');
    c.fillStyle = '#fff'; c.fillRect(720 + 110 * 260 / 700, 4, 2, 12); c.fillStyle = '#ffd740'; c.fillRect(720 + 110 * 560 / 700, 4, 2, 12);
    if (hintT > 0 && E.state === 'play') { c.globalAlpha = Math.min(1, hintT); c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, H - 46, W, 34); E.text(c, E.input.touch ? LEVELS[lvl].hint.replace('mouse or WASD', 'drag anywhere').replace('Hold click / Space', 'Hold REEL').replace('Press R to restart', 'Pause and quit to retry') : LEVELS[lvl].hint, W / 2, H - 23, 16, '#fff', 'center'); c.globalAlpha = 1; }
  };

  G._dbg = { s: () => ({ A, F, crystals, foes, lvl, hp, time, gates }), win: () => (crystals.length = 0), load: startLevel };
  E.start(G);
})();

</script>
</body>
</html>
