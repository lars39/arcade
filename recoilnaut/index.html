    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, color, size: rand(0.6, 1.4) * size });

    orbiter: { r: 14, hp: 4, spd: 120, col: '#b47bff', pts: 200 },
    mine: { r: 15, hp: 3, spd: 25, col: '#ffd23d', pts: 150 },
    heavy: { r: 24, hp: 14, spd: 60, col: '#ff8a3d', pts: 450 },
    lancer: { r: 13, hp: 3, spd: 90, col: '#3dffb0', pts: 300 },
    dread: { r: 50, hp: 160, spd: 35, col: '#ff3d8a', pts: 6000, boss: true },

    bullets = []; ebul = []; enemies = []; cells = []; spawns = [];
    wave = 0; score = 0; combo = 1; comboT = 0; kills = 0; rams = 0; tierBanner = 0;
    stars = []; for (let i = 0; i < 140; i++) stars.push({ x: rand(W), y: rand(H), z: rand(0.2, 1) });

  }
  function startWave() {

    enemies.push({ type, T, x, y, vx: 0, vy: 0, r: T.r, hp: T.hp * hm, maxHp: T.hp * hm, fire: rand(1, 2.5), flash: 0, t: rand(5), st: 0, aim: 0, ramCd: 0 });
