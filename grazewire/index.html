/* GRAZEWIRE — a bullet-dodger where you have no gun. Skimming bullets charges your wire;

const GZ = (() => {

  const NAMES = ['Spindle', 'Hollow Bell', 'Moth Engine', 'Glass Pike', 'Cinder Choir', 'Static Saint', 'The Orrery', 'Lantern Mother', 'Knotwork', 'Velvet Furnace', 'Quiet Comet', 'Thornclock'];
  const BOSS_COLS = ['#ff4fa0', '#ffb84a', '#b37bff', '#4ad8ff', '#ff6b4a', '#f0ff4a', '#4affc3'];

  function bullet(x, y, a, s, o = {}) {

    rings: L => { let t = 0.5, k = 0; const n = 14 + Math.floor(L * 4);
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(0.5, 1.2 - L * 0.1); k++; for (let i = 0; i < n; i++) bullet(b.x, b.y, (i + (k % 2) * 0.5) / n * TAU, 130 + L * 10, { r: 8 }); E.sfx('zap'); } }; },

    rain: L => { let t = 0;
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(0.04, 0.12 - L * 0.012); const x = rand(20, W - 20); bullet(x, -10, Math.PI / 2 + rand(-0.15, 0.15), rand(120, 190) + L * 10, { r: 5, sway: rand(1, 3), col: C.c }); } }; },
    lasers: L => { let t = 1.2;
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(1.3, 2.6 - L * 0.2); const n = 1 + Math.floor(L / 1.5); const a0 = angTo(b.x, b.y, P.x, P.y);
        for (let i = 0; i < n; i++) lasers.push({ x: b.x, y: b.y, a: a0 + (i - (n - 1) / 2) * 0.45, warn: 0.9, on: 0.55, w: 18, rot: (Math.random() < 0.5 ? 1 : -1) * (L > 2 ? 0.25 : 0) }); } }; },
    bloom: L => { let t = 0.8;
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(0.8, 1.8 - L * 0.12); const n = 10 + Math.floor(L * 2), off = rand(TAU);
        for (let i = 0; i < n; i++) bullet(b.x, b.y, off + i / n * TAU, 260, { r: 7, acc: -260, stopT: 0.9, reaim: 170 + L * 15, col: '#ffe14a' }); E.sfx('zap'); } }; },
    bouncers: L => { let t = 0.6;
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(0.9, 2 - L * 0.15); bullet(b.x, b.y, rand(0.3, Math.PI - 0.3), 150 + L * 10, { r: 16, bounce: 2, col: '#ff7a4a' }); } }; },
    walls: L => { let t = 0;
      return (b, dt) => { t -= dt; if (t <= 0) { t = Math.max(1.1, 2.0 - L * 0.12); const gap = rand(120, W - 220), gw = Math.max(110, 190 - L * 12);
        for (let x = 10; x < W; x += 26) if (x < gap || x > gap + gw) bullet(x, -12, Math.PI / 2, 120 + L * 8, { r: 7, col: '#b37bff' }); } }; },
    helix: L => { let t = 0, ph = 0;
      return (b, dt) => { t += dt; ph += dt * 3; const rate = Math.max(0.035, 0.07 - L * 0.006); while (t > rate) { t -= rate; const a0 = Math.PI / 2;
        bullet(b.x, b.y, a0 + Math.sin(ph) * 1.1, 200 + L * 10, { r: 5, col: '#4affc3' }); bullet(b.x, b.y, a0 - Math.sin(ph) * 1.1, 200 + L * 10, { r: 5, col: '#4affc3' }); } }; },
  };
  const PKEYS = Object.keys(PATTERNS);

  function makeBoss(n) {
    const keys = PKEYS.slice().sort(() => Math.random() - 0.5);
    const phases = [];
    // each phase mixes 1–2 patterns; later bosses mix more
    for (let p = 0; p < 3; p++) { const ks = [keys[p * 2 % keys.length]]; if (n >= 1 || p === 2) ks.push(keys[(p * 2 + 1) % keys.length]); phases.push(ks); }
    const hp = 260 + n * 140;
    boss = { n, name: NAMES[n % NAMES.length] + (n >= NAMES.length ? ' ' + 'I'.repeat(1 + Math.floor(n / NAMES.length)) : ''), col: BOSS_COLS[n % BOSS_COLS.length],
      x: W / 2, y: -100, tx: W / 2, ty: 160, hp, maxHp: hp, phases, phase: -1, run: [], flash: 0, t: 0, entering: 1.6, sides: 3 + (n % 5), dying: 0 };
    nextPhase();
    phaseBanner = 2.5;
  }
  function nextPhase() {
    boss.phase++; const L = boss.n * 0.55 + boss.phase * 0.45;
    boss.run = boss.phases[boss.phase].map(k => PATTERNS[k](L));
    if (boss.phase > 0) { clearBullets(boss.x, boss.y, 9999, false); E.sfx('power'); E.ring(boss.x, boss.y, 200, boss.col, 0.6, 8); E.shake(10); }
  }
  function clearBullets(x, y, r, points) {
    for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; if (dist2(b.x, b.y, x, y) < r * r) { if (points) { score += 5; E.burst(b.x, b.y, 2, b.col, 100, 0.3, 2); } bullets.splice(i, 1); } }
    if (r > 5000) lasers.length = 0;
  }
  function reset() {
    P = { x: W / 2, y: H - 120, r: 4, hp: 3, inv: 0, focus: false, trail: [] };
    bullets = []; lasers = []; sparks = []; bossN = 0; score = 0; charge = 0; graze = 0; hits = 0; totalGrazes = 0; noHit = true; runT = 0; interlude = 0; gridOff = 0;
    makeBoss(0);
  }
  function hurt() {
    if (P.inv > 0) return;
    P.hp--; hits++; noHit = false; P.inv = 2; charge *= 0.5;
    E.sfx('hurt'); E.shake(18); E.hitstop(0.12); E.burst(P.x, P.y, 40, C.a, 400, 0.8, 3); E.ring(P.x, P.y, 220, '#fff', 0.5, 6);
    clearBullets(P.x, P.y, 180, false);
    if (P.hp <= 0) { E.burst(P.x, P.y, 100, C.a, 600, 1.2, 4); E.gameOver(score, [`Defeated ${bossN} Warden${bossN === 1 ? '' : 's'}`, `${totalGrazes} grazes • survived ${Math.floor(runT)}s`]); }
  }
  function release() {
    if (charge < 20 || !boss || boss.entering > 0 || boss.dying) { E.sfx('hit'); return; }
    const power = charge; charge = 0;
    const n = Math.round(power / 6);
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + rand(-1.3, 1.3); sparks.push({ x: P.x, y: P.y, vx: Math.cos(a) * rand(300, 600), vy: Math.sin(a) * rand(300, 600), dmg: power * 1.6 / n, big: true, t: 0 }); }
    clearBullets(P.x, P.y, 90 + power * 1.6, true);
    E.ring(P.x, P.y, 90 + power * 1.6, C.a, 0.45, 6); E.shake(power / 8); E.sfx('power');
    E.tone({ f: 120, f2: 1200, d: 0.35, type: 'sawtooth', v: 0.12 });
  }
  function update(dt) {
    runT += dt; gridOff = (gridOff + dt * 40) % 40;
    // movement
    const m = E.move();
    P.focus = !!(E.keys.ShiftLeft || E.keys.ShiftRight);
    const spd = P.focus ? 160 : 340;
    let mx = m.x * spd * dt, my = m.y * spd * dt;
    const s = E.sticks.move || E.sticks.aim;
    if (s) { // touch: relative drag — the ship mirrors finger motion
      if (s.px !== undefined) { mx = (s.x - s.px) * 1.4; my = (s.y - s.py) * 1.4; } else { mx = my = 0; }
      s.px = s.x; s.py = s.y; s.ox = s.x; s.oy = s.y;
    } else if (!m.x && !m.y && E.mouse.down && E.lastInput === 'mouse') { // mouse: hold to steer toward cursor
      const dx = E.mouse.x - P.x, dy = E.mouse.y - P.y, l = Math.hypot(dx, dy), st = Math.min(l, spd * 1.2 * dt);
      if (l > 1) { mx = dx / l * st; my = dy / l * st; }
    }
    P.x = clamp(P.x + mx, 10, W - 10); P.y = clamp(P.y + my, 10, H - 10);
    P.trail.push({ x: P.x, y: P.y }); if (P.trail.length > 10) P.trail.shift();
    P.inv -= dt;
    if (E.actionPressed()) release();
    // boss
    if (interlude > 0) {
      interlude -= dt;
      if (interlude <= 0) { bossN++; makeBoss(bossN); }
    } else if (boss) {
      const b = boss; b.t += dt; b.flash -= dt;
      if (b.dying > 0) {
        b.dying -= dt; E.burst(b.x + rand(-40, 40), b.y + rand(-40, 40), 3, b.col, 300, 0.6, 3); E.shake(6);
        if (b.dying <= 0) {
          E.burst(b.x, b.y, 160, b.col, 700, 1.3, 4); E.ring(b.x, b.y, 400, '#fff', 0.8, 10); E.sfx('explode'); E.shake(26); E.hitstop(0.2);
          const bonus = 5000 * (bossN + 1) + (noHit ? 5000 : 0); score += bonus;
          E.float(W / 2, H / 2, `WARDEN DOWN +${bonus.toLocaleString()}`, C.a, 40); if (noHit) E.float(W / 2, H / 2 + 44, 'FLAWLESS', '#fff', 30);
          P.hp = Math.min(5, P.hp + 1); boss = null; interlude = 2.5; noHit = true; clearBullets(0, 0, 99999, true);
        }
      } else if (b.entering > 0) { b.entering -= dt; b.x = lerp(b.x, b.tx, dt * 3); b.y = lerp(b.y, b.ty, dt * 3); }
      else {
        if (Math.abs(b.x - b.tx) < 5 || Math.random() < dt * 0.15) { b.tx = rand(260, W - 260); b.ty = rand(100, 230); }
        b.x = lerp(b.x, b.tx, dt * 0.9); b.y = lerp(b.y, b.ty, dt * 0.9);
        for (const r of b.run) r(b, dt);
      }
      E.intensity = 0.55 + 0.15 * (boss ? boss.phase : 0) + Math.min(0.2, bossN * 0.05);
    }
    // bullets
    const pr = P.r, gr2 = GRAZE_R * GRAZE_R;
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; if (!b) continue; b.t += dt; // hurt() can clear several bullets mid-loop
      if (b.acc) { const sp = Math.hypot(b.vx, b.vy); const ns = Math.max(0, sp + b.acc * dt); if (sp > 0) { b.vx *= ns / sp; b.vy *= ns / sp; } }
      if (b.stopT !== undefined && b.t > b.stopT) { const a = angTo(b.x, b.y, P.x, P.y); b.vx = Math.cos(a) * b.reaim; b.vy = Math.sin(a) * b.reaim; b.acc = 0; b.stopT = undefined; }
      if (b.sway) b.vx = Math.sin(b.t * b.sway + b.x * 0.01) * 50;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.bounce > 0) { if (b.x < b.r || b.x > W - b.r) { b.vx *= -1; b.bounce--; b.x = clamp(b.x, b.r, W - b.r); } if (b.y > H - b.r || b.y < b.r && b.t > 0.5) { b.vy *= -1; b.bounce--; b.y = clamp(b.y, b.r, H - b.r); } }
      if (b.x < -40 || b.x > W + 40 || b.y < -60 || b.y > H + 40) { bullets.splice(i, 1); continue; }
      const d2 = dist2(b.x, b.y, P.x, P.y);
      if (d2 < (b.r * 0.75 + pr) ** 2) { if (P.inv <= 0) { bullets.splice(i, 1); hurt(); } continue; }
      if (!b.grazed && d2 < (b.r + GRAZE_R) ** 2 && P.inv <= 0) { b.grazed = true; doGraze(b.x, b.y); }
    }
    // lasers
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      if (boss && !boss.dying) { l.x = boss.x; l.y = boss.y; }
      if (l.warn > 0) { l.warn -= dt; if (l.warn <= 0) { E.sfx('zap'); E.shake(4); } continue; }
      l.on -= dt; l.a += l.rot * dt; if (l.on <= 0) { lasers.splice(i, 1); continue; }
      const x2 = l.x + Math.cos(l.a) * 2000, y2 = l.y + Math.sin(l.a) * 2000;
      if (P.inv <= 0 && segCircle(l.x, l.y, x2, y2, P.x, P.y, l.w / 2 + pr - 2)) hurt();
      else if (P.inv <= 0 && segCircle(l.x, l.y, x2, y2, P.x, P.y, l.w / 2 + GRAZE_R)) { l.gt = (l.gt || 0) - dt; if (l.gt <= 0) { l.gt = 0.08; doGraze(P.x, P.y); } }
    }
    // sparks home onto the boss
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i]; s.t += dt;
      if (!boss || boss.dying) { sparks.splice(i, 1); continue; }
      const a = angTo(s.x, s.y, boss.x, boss.y), sp = 500 + s.t * 900;
      s.vx = lerp(s.vx, Math.cos(a) * sp, Math.min(1, dt * (3 + s.t * 8))); s.vy = lerp(s.vy, Math.sin(a) * sp, Math.min(1, dt * (3 + s.t * 8)));
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (dist2(s.x, s.y, boss.x, boss.y) < 40 * 40) {
        sparks.splice(i, 1); boss.hp -= s.dmg; boss.flash = 0.06; score += Math.round(s.dmg * 10);
        E.burst(s.x, s.y, s.big ? 8 : 2, C.a, s.big ? 300 : 120, 0.35, 2); E.sfx('hit');
        if (s.big) E.shake(3);
        const thr = boss.maxHp * (1 - (boss.phase + 1) / 3);
        if (boss.hp <= 0) { boss.hp = 0; boss.dying = 1.4; bullets.length = 0; lasers.length = 0; E.sfx('explode'); }
        else if (boss.phase < 2 && boss.hp <= thr) nextPhase();
      }
    }
    graze = Math.max(0, graze - dt * 1.5);
    phaseBanner -= dt;
  }
  function doGraze(x, y) {
    totalGrazes++; graze = Math.min(10, graze + 1);
    charge = Math.min(100, charge + 2.6);
    const mult = 1 + Math.floor(graze); score += 10 * mult;
    E.spray(P.x, P.y, angTo(x, y, P.x, P.y), 0.8, 3, C.a, 200, 0.25, 2);
    E.tone({ f: 1400 + graze * 120, d: 0.04, type: 'triangle', v: 0.05 });
    if (boss && !boss.dying && boss.entering <= 0) sparks.push({ x: P.x, y: P.y, vx: rand(-200, 200), vy: rand(-300, -100), dmg: 1, t: 0 });
  }

  function draw(c) {
    // scrolling grid floor
    c.strokeStyle = 'rgba(80,140,200,0.08)'; c.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
    for (let y = -40 + gridOff; y <= H; y += 40) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    if (!P) return;
    // lasers
    for (const l of lasers) {
      const x2 = l.x + Math.cos(l.a) * 2000, y2 = l.y + Math.sin(l.a) * 2000;
      c.lineCap = 'butt';
      if (l.warn > 0) { c.strokeStyle = E.hexA(boss ? boss.col : C.b, 0.25 + 0.25 * Math.sin(E.t * 40)); c.lineWidth = 2; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(l.x, l.y); c.lineTo(x2, y2); c.stroke(); c.setLineDash([]); }
      else { c.globalCompositeOperation = 'lighter'; c.strokeStyle = E.hexA(boss ? boss.col : C.b, 0.5); c.lineWidth = l.w + 14; c.beginPath(); c.moveTo(l.x, l.y); c.lineTo(x2, y2); c.stroke(); c.strokeStyle = '#fff'; c.lineWidth = l.w * 0.5; c.stroke(); c.globalCompositeOperation = 'source-over'; }
    }
    // boss
    if (boss) {
      const b = boss; c.save(); c.translate(b.x + (b.dying ? rand(-4, 4) : 0), b.y);
      E.drawGlow(c, 0, 0, b.col, 110, 0.6);
      for (let k = 0; k < 3; k++) {
        c.rotate(b.t * (0.4 + k * 0.3) * (k % 2 ? -1 : 1));
        c.strokeStyle = k === 0 ? '#fff' : b.col; c.lineWidth = 3; c.beginPath();
        const rr = 60 - k * 14; for (let i = 0; i <= b.sides; i++) { const a = i / b.sides * TAU; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.stroke();
      }
      c.fillStyle = b.flash > 0 ? '#fff' : b.col; c.beginPath(); c.arc(0, 0, 16, 0, TAU); c.fill();
      c.restore();
    }
    // sparks
    for (const s of sparks) { E.drawGlow(c, s.x, s.y, C.a, s.big ? 16 : 8); }
    // bullets
    for (const b of bullets) { E.drawGlow(c, b.x, b.y, b.col, b.r * 2.4, 0.8); c.fillStyle = '#fff'; c.beginPath(); c.arc(b.x, b.y, b.r * 0.6, 0, TAU); c.fill(); }
    // player
    if (E.state !== 'title' && P.hp > 0) {
      c.globalCompositeOperation = 'lighter';
      P.trail.forEach((t, i) => { c.globalAlpha = i / P.trail.length * 0.4; c.fillStyle = C.a; c.beginPath(); c.arc(t.x, t.y, 6, 0, TAU); c.fill(); });
      c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      if (!(P.inv > 0 && Math.sin(E.t * 30) > 0)) {
        c.strokeStyle = E.hexA(C.a, 0.25 + graze * 0.05); c.lineWidth = 1.5; c.beginPath(); c.arc(P.x, P.y, GRAZE_R, 0, TAU); c.stroke();
        E.drawGlow(c, P.x, P.y, C.a, 22 + charge * 0.2, 0.8);
        c.fillStyle = '#0b1a05'; c.strokeStyle = C.a; c.lineWidth = 2;
        c.beginPath(); c.moveTo(P.x, P.y - 14); c.lineTo(P.x + 10, P.y + 10); c.lineTo(P.x, P.y + 5); c.lineTo(P.x - 10, P.y + 10); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#fff'; c.beginPath(); c.arc(P.x, P.y, P.r, 0, TAU); c.fill();
      }
      // charge arc
      c.strokeStyle = charge >= 20 ? C.a : 'rgba(255,255,255,0.3)'; c.lineWidth = 3; c.beginPath(); c.arc(P.x, P.y, 36, -Math.PI / 2, -Math.PI / 2 + TAU * charge / 100); c.stroke();
    }
  }
  function hud(c) {
    if (!P) return;
    for (let i = 0; i < P.hp; i++) { c.fillStyle = C.a; c.beginPath(); const x = 30 + i * 26, y = 32; c.moveTo(x, y - 9); c.lineTo(x + 8, y + 7); c.lineTo(x - 8, y + 7); c.closePath(); c.fill(); }
    E.txt(c, score.toLocaleString(), W - 90, 34, 30, '#fff', 'right');
    E.txt(c, 'WIRE', 20, H - 52, 16, C.a, 'left');
    E.bar(c, 20, H - 38, 240, 12, charge / 100, charge >= 20 ? C.a : '#557733');
    c.fillStyle = '#fff'; c.fillRect(20 + 240 * 0.2, H - 40, 2, 16);
    if (charge >= 20 && E.state === 'play') E.txt(c, E.lastInput === 'touch' ? 'tap RELEASE' : 'SPACE to release', 270, H - 32, 15, 'rgba(255,255,255,0.7)', 'left');
    if (graze >= 1) E.txt(c, 'GRAZE x' + (1 + Math.floor(graze)), 20, H - 76, 18, C.c, 'left');
    if (boss) {
      const w = 560; E.txt(c, `WARDEN ${boss.n + 1}: ${boss.name.toUpperCase()}`, W / 2, 22, 18, boss.col);
      E.bar(c, W / 2 - w / 2, 36, w, 10, boss.hp / boss.maxHp, boss.col);
      for (let k = 1; k < 3; k++) { c.fillStyle = '#000'; c.fillRect(W / 2 - w / 2 + w * k / 3, 34, 3, 14); }
      if (phaseBanner > 0 && E.state === 'play') { c.globalAlpha = clamp(phaseBanner, 0, 1); E.txt(c, boss.name.toUpperCase(), W / 2, H / 2 - 40, 64, boss.col, 'center', 24); E.txt(c, `Warden ${boss.n + 1}`, W / 2, H / 2 + 14, 24, '#fff'); c.globalAlpha = 1; }
    }
  }
  window.__debug = () => ({ boss: boss && boss.name, bullets: bullets.length, charge, hp: P.hp });
  window.__stress = () => { P.inv = 1e9; for (let k = 0; k < 4; k++) { for (let i = 0; i < 600; i++) update(1 / 60); if (boss) { boss.hp = 1; sparks.push({ x: boss.x, y: boss.y, vx: 0, vy: 0, dmg: 5, t: 0 }); } for (let i = 0; i < 300; i++) update(1 / 60); } P.inv = 0; return { bossN, bullets: bullets.length }; };
  return {
    id: 'grazewire', name: 'Grazewire', tagline: 'No gun. Just nerve. Skim the bullets to charge your lightning.',
    colors: C, actionLabel: 'RELEASE', aimStick: false,
    controls: ['WASD / Arrows — move (Shift = precise)   or hold Left Click to steer', 'Skim past bullets to GRAZE and charge your wire', 'Space / Right Click — release the charge as a lightning lance'],
    touchControls: ['Drag anywhere — the ship follows your finger', 'Skim past bullets to GRAZE and charge your wire', 'RELEASE — unleash the lance (needs 20% charge)'],
    musicCfg: { bpm: 140, root: 98, scale: [0, 2, 3, 7, 8], prog: [0, 3, 4, 2], arp: [0, 4, 2, 5, 4, 7, 5, 2], leadType: 'sawtooth' },
    reset, update, draw, hud,
    pauseInfo: () => [`Warden ${bossN + 1}  •  ${totalGrazes} grazes`],
  };
})();
const GAMEDEF = GZ;

E.boot(GAMEDEF);
</script></body></html>
