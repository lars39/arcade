<script>
'use strict';
/* Shared micro-engine: canvas scaling, input (kb/mouse/touch twin-stick), procedural audio,

const W = 1280, H = 720, TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

const pick = a => a[Math.floor(Math.random() * a.length)];
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((cx - x1) * dx + (cy - y1) * dy) / l2, 0, 1);
  return dist2(x1 + dx * t, y1 + dy * t, cx, cy) <= r * r;
}

const E = { W, H, t: 0, dt: 0, state: 'loading', timeScale: 1, lastInput: 'mouse', intensity: 0.5 };
let GAME = null;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let viewScale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const iw = window.innerWidth, ih = window.innerHeight;
  viewScale = Math.min(iw / W, ih / H) || 1;
  cv.width = Math.max(1, Math.round(W * viewScale * dpr));
  cv.height = Math.max(1, Math.round(H * viewScale * dpr));
  cv.style.width = (W * viewScale) + 'px';
  cv.style.height = (H * viewScale) + 'px';
  cv.style.left = ((iw - W * viewScale) / 2) + 'px';
  cv.style.top = ((ih - H * viewScale) / 2) + 'px';
}
window.addEventListener('resize', resize);

/* ---------- storage ---------- */
// Progress (best score, mute) is saved in the browser's localStorage.
E.load = k => { try { return localStorage.getItem(GAME.id + '_' + k); } catch (e) { return null; } };
E.save = (k, v) => { try { localStorage.setItem(GAME.id + '_' + k, String(v)); } catch (e) { } };

/* ---------- game-flow hooks (no platform SDK; kept so game code can call them) ---------- */
const CG = { start() { }, stop() { }, happy() { }, midgame(cb) { cb(); } };
E.CG = CG;

/* ---------- input ---------- */
const keys = {}, pressed = {};
const mouse = { x: W / 2, y: H / 2, down: false, rdown: false };
let clicks = [];
const sticks = { move: null, aim: null, act: null };
const ACT = { x: W - 120, y: H - 300, r: 54 };
const PAUSE_BTN = { x: W - 44, y: 40, r: 26 };
E.keys = keys; E.mouse = mouse; E.sticks = sticks;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouchDevice) E.lastInput = 'touch';
window.addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; E.lastInput = 'kb'; unlockAudio();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false; mouse.down = mouse.rdown = false;
  sticks.move = sticks.aim = sticks.act = null;
  if (E.state === 'play') E.pause(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && E.state === 'play') E.pause(true); });
function toLocal(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
function uiHit(p) { return E.state === 'play' && dist(p.x, p.y, PAUSE_BTN.x, PAUSE_BTN.y) < PAUSE_BTN.r + 12; }
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  const p = toLocal(e.clientX, e.clientY);
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }

    E.lastInput = 'touch'; clicks.push(p);
    if (E.state === 'play' && !uiHit(p) && !(GAME.touchBlock && GAME.touchBlock())) {
      if (GAME.actionLabel && dist(p.x, p.y, ACT.x, ACT.y) < ACT.r + 18) { sticks.act = { id: e.pointerId }; pressed.Action = true; }
      else if (p.x < W * 0.5 && !sticks.move) sticks.move = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y };
      else if (!sticks.aim) sticks.aim = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, t0: E.t };
    }
  } else {
    E.lastInput = 'mouse'; mouse.x = p.x; mouse.y = p.y;
    if (e.button === 2) { mouse.rdown = true; pressed.Action = true; }
    else if (uiHit(p) || (GAME.modal && GAME.modal())) { clicks.push(p); } else { mouse.down = true; clicks.push(p); pressed.Mouse = true; }
  }
});
cv.addEventListener('pointermove', e => {
  const p = toLocal(e.clientX, e.clientY);
  if (e.pointerType === 'touch') {
    for (const k of ['move', 'aim']) { const s = sticks[k]; if (s && s.id === e.pointerId) { s.x = p.x; s.y = p.y; } }
  } else { mouse.x = p.x; mouse.y = p.y; if (E.lastInput !== 'kb') E.lastInput = 'mouse'; E.mouseMovedAt = E.t; }
});
function ptrUp(e) {
  if (e.pointerType === 'touch') {
    for (const k of ['move', 'aim', 'act']) { const s = sticks[k]; if (s && s.id === e.pointerId) { sticks[k] = null; if (k === 'aim') E.aimReleased = true; } }
  } else { if (e.button === 2) mouse.rdown = false; else { if (mouse.down) E.aimReleased = true; mouse.down = false; } }
}
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);

E.pressed = c => !!pressed[c];
E.move = () => {
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x--; if (keys.KeyD || keys.ArrowRight) x++;
  if (keys.KeyW || keys.ArrowUp) y--; if (keys.KeyS || keys.ArrowDown) y++;
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  const s = sticks.move;
  if (s) {
    let dx = s.x - s.ox, dy = s.y - s.oy; const l = Math.hypot(dx, dy), R = 70;
    if (l > R) { s.ox = s.x - dx / l * R; s.oy = s.y - dy / l * R; dx = dx / l * R; dy = dy / l * R; }
    if (l < 8) return { x: 0, y: 0 };
    return { x: dx / R, y: dy / R };
  }
  return { x: 0, y: 0 };
};
E._lastAim = 0;
/* Aim from (px,py): touch aim stick, else mouse. fire = trigger held. */
E.aim = (px, py) => {
  const s = sticks.aim;
  if (s) {
    const dx = s.x - s.ox, dy = s.y - s.oy;
    if (Math.hypot(dx, dy) > 10) E._lastAim = Math.atan2(dy, dx);
    else if (GAME.autoAim) { const a = GAME.autoAim(); if (a !== null && a !== undefined) E._lastAim = a; }
    return { a: E._lastAim, fire: true };
  }
  if (E.lastInput === 'touch') return { a: E._lastAim, fire: false };
  return { a: Math.atan2(mouse.y - py, mouse.x - px), fire: mouse.down || !!keys.KeyJ };
};
E.action = () => !!(keys.Space || keys.ShiftLeft && GAME.shiftIsAction || mouse.rdown || sticks.act);
E.actionPressed = () => !!(pressed.Space || pressed.Action);

/* ---------- audio ---------- */
let ac = null, master = null, sfxBus = null, musBus = null, noiseBuf = null, adMute = false;
E.muted = false;
function unlockAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.connect(ac.destination);
      const comp = ac.createDynamicsCompressor(); comp.connect(master);
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.6; sfxBus.connect(comp);
      musBus = ac.createGain(); musBus.gain.value = 0.2; musBus.connect(comp);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    } catch (e) { ac = null; }
  }

}
function applyVolume() { if (master) master.gain.value = (E.muted || adMute) ? 0 : 1; }
E.toggleMute = () => { E.muted = !E.muted; E.save('mute', E.muted ? 1 : 0); applyVolume(); };
E.tone = o => {
  if (!ac || E.muted || adMute) return;
  const now = ac.currentTime + Math.max(0, o.delay || 0), d = o.d || 0.1, v = o.v == null ? 0.2 : o.v;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), now + (o.a || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, now + d);

    src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    if (o.f) {
      const fl = ac.createBiquadFilter(); fl.type = o.filter || 'bandpass';
      fl.frequency.setValueAtTime(o.f, now); if (o.f2) fl.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), now + d);

    src = ac.createOscillator(); src.type = o.type || 'square';
    src.frequency.setValueAtTime(o.f || 440, now);
    if (o.f2) src.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), now + d);

  shoot: () => E.tone({ f: 900, f2: 260, d: 0.07, type: 'square', v: 0.05 }),
  hit: () => E.tone({ f: 320, f2: 90, d: 0.08, type: 'sawtooth', v: 0.09 }),
  explode: () => { E.tone({ noise: 1, f: 1400, f2: 60, d: 0.45, v: 0.3, filter: 'lowpass' }); E.tone({ f: 130, f2: 30, d: 0.3, type: 'sine', v: 0.35 }); },
  small: () => E.tone({ noise: 1, f: 2200, f2: 200, d: 0.15, v: 0.15, filter: 'lowpass' }),
  pickup: () => { E.tone({ f: 660, d: 0.08, type: 'triangle', v: 0.14 }); E.tone({ f: 990, d: 0.12, type: 'triangle', v: 0.14, delay: 0.06 }); },
  hurt: () => { E.tone({ f: 220, f2: 50, d: 0.4, type: 'sawtooth', v: 0.25 }); E.tone({ noise: 1, f: 700, d: 0.3, v: 0.22 }); },
  power: () => [0, 4, 7, 12].forEach((n, i) => E.tone({ f: nt(n), d: 0.16, type: 'square', v: 0.07, delay: i * 0.06 })),
  select: () => E.tone({ f: 520, f2: 800, d: 0.08, type: 'triangle', v: 0.12 }),
  dash: () => E.tone({ noise: 1, f: 2400, f2: 300, d: 0.2, v: 0.16 }),
  wave: () => [0, 3, 7, 10, 12].forEach((n, i) => E.tone({ f: nt(n - 9), d: 0.25, type: 'triangle', v: 0.12, delay: i * 0.08 })),
  over: () => [12, 7, 3, 0, -5].forEach((n, i) => E.tone({ f: nt(n - 12), d: 0.4, type: 'sawtooth', v: 0.1, delay: i * 0.16 })),
  zap: () => E.tone({ f: 1800, f2: 400, d: 0.12, type: 'sawtooth', v: 0.07 }),

const sfxCount = {};
E.sfx = (name, ...a) => {
  if (!ac) return; const c = sfxCount[name] || 0; if (c >= 3) return; sfxCount[name] = c + 1;
  const f = (GAME.sfx && GAME.sfx[name]) || SFX[name]; if (f) f(...a);

let mus = null;
E.music = cfg => { mus = cfg ? Object.assign({ step: 0, next: 0 }, cfg) : null; };
function musicTick() {
  if (!mus || !ac || E.muted || adMute || ac.state !== 'running') return;
  if (E.state !== 'play' && E.state !== 'title') return;
  const spb = 60 / mus.bpm / 4;
  if (mus.next < ac.currentTime) mus.next = ac.currentTime + 0.05;
  while (mus.next < ac.currentTime + 0.2) {
    const s = mus.step, t = mus.next - ac.currentTime, sc = mus.scale;

    const n = d => mus.root * Math.pow(2, (sc[((d % sc.length) + sc.length) % sc.length] + 12 * Math.floor(d / sc.length)) / 12);

    if (s % 4 === 0 && I > 0.2) E.tone({ f: 140, f2: 38, d: 0.16, type: 'sine', v: 0.55, delay: t, bus: musBus });

    if (I > 0.6 || E.state === 'title') { const arp = mus.arp || [0, 2, 4, 7, 4, 2, 4, 7]; if (s % 2 === 0 || I > 0.85) E.tone({ f: n(deg + arp[s % arp.length]) * 2, d: spb * 0.9, type: mus.leadType || 'square', v: 0.05, delay: t, bus: musBus }); }

/* ---------- juice: particles, rings, floating text, shake, hitstop ---------- */
const parts = [], rings = [], texts = [];
let shakeAmt = 0, hitstopT = 0;
E.burst = (x, y, n, color, spd = 220, life = 0.6, size = 3) => {
  for (let i = 0; i < n; i++) {
    if (parts.length > 1000) parts.shift();
    const a = rand(TAU), s = rand(0.15, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, color, size: rand(0.6, 1.4) * size });
  }
};
E.spray = (x, y, ang, spread, n, color, spd = 260, life = 0.4, size = 2.5) => {
  for (let i = 0; i < n; i++) {

    const a = ang + rand(-spread, spread), s = rand(0.3, 1) * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, color, size: rand(0.6, 1.4) * size });
  }
};
E.ring = (x, y, r, color, life = 0.4, w = 4) => rings.push({ x, y, r, color, life, max: life, w });

  function fire(a) {
    if (P.ammo <= 0) { E.tone({ f: 160, d: 0.05, type: 'square', v: 0.05 }); return; }

    bolts.push({ x: P.x + Math.cos(a) * 16, y: P.y + Math.sin(a) * 16, vx: Math.cos(a) * 760, vy: Math.sin(a) * 760, r: 5, pow: up.startPow, b: 0, hit: new Set(), kills: 0, trail: [], split: false });

  }
  function spawnAt(type) {
    let x, y, t = 0;
    do { x = rand(BL + 40, BR - 40); y = rand(BT + 40, BB - 40); t++; } while ((dist(x, y, P.x, P.y) < 300 || inPillar(x, y, 30)) && t < 50);
    spawns.push({ type, x, y, t: 0.9 });
  }
  function addEnemy(type, x, y) {
    const T = TYPES[type], hm = 1 + (room - 1) * 0.1;
    enemies.push({ type, T, x, y, r: T.r, hp: T.hp * hm, maxHp: T.hp * hm, face: angTo(x, y, P.x, P.y), fire: rand(1.5, 3), flash: 0, t: rand(5), kx: 0, ky: 0 });
  }
  function hurt() {
    if (P.inv > 0) return;
    P.hp--; P.inv = 1.4; E.sfx('hurt'); E.shake(14); E.hitstop(0.08); E.burst(P.x, P.y, 30, C.b, 300, 0.7, 3);
    if (P.hp <= 0) { E.burst(P.x, P.y, 100, C.b, 600, 1.2, 4); E.sfx('explode'); E.gameOver(score, [`Cleared ${room - 1} room${room === 2 ? '' : 's'}`, `${kills} foes • best carom: ${bestCarom} bounce${bestCarom === 1 ? '' : 's'}`]); }
  }
  const caromName = n => ['DIRECT', 'BANK SHOT', 'DOUBLE CAROM', 'TRIPLE CAROM', 'QUAD CAROM', 'IMPOSSIBLE'][Math.min(5, n)];
  function kill(e, bolt) {
    const i = enemies.indexOf(e); if (i < 0) return; enemies.splice(i, 1); kills++;

    let pts = e.T.pts * (1 + n); if (bolt) { bolt.kills++; if (bolt.kills > 1) pts *= bolt.kills; }
    score += Math.round(pts);
    E.float(e.x, e.y - 14, (n > 0 ? caromName(n) + ' ' : '') + '+' + Math.round(pts) + (bolt && bolt.kills > 1 ? ' ×' + bolt.kills : ''), n > 0 ? POW_COLS[Math.min(5, n)] : '#fff', n > 1 ? 24 : 18);
    E.burst(e.x, e.y, 24, e.T.col, 300, 0.7, 3); E.ring(e.x, e.y, e.r * 3, e.T.col, 0.35); E.sfx('small'); E.shake(4 + n * 2);
    if (n >= 3) E.hitstop(0.06);
  }

  function update(dt) {

    if (!touch && E.pressed('Mouse')) fire(aim.a);
    if (!touch && E.keys.KeyJ && !P.jHeld) fire(aim.a); P.jHeld = !!E.keys.KeyJ;
    if (touch && E.aimReleased) fire(E._lastAim);
    if (E.actionPressed()) fire(aim.a);
    preview = (touch ? !!E.sticks.aim : true) ? computePreview(aim.a) : null;
    // spawning
    spawnT -= dt; const cap = 4 + room * 2;
    if (toSpawn.length && spawnT <= 0 && enemies.length + spawns.length < cap) { spawnAt(toSpawn.shift()); spawnT = Math.max(0.4, 1.3 - room * 0.08); }

          E.burst(b.x, b.y, 8, POW_COLS[Math.min(5, b.pow)], 200, 0.3, 2); E.tone({ f: 500 + b.b * 220, d: 0.08, type: 'square', v: 0.07 }); E.shake(1.5);
          if (up.split && b.b === 1 && !b.split) { b.split = true; const a = Math.atan2(b.vy, b.vx) + 0.35; const sp = Math.hypot(b.vx, b.vy); bolts.push(Object.assign({}, b, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, hit: new Set(), trail: [], split: true })); }
          if (b.b > up.bounce) { dead = true; E.burst(b.x, b.y, 12, '#fff', 180, 0.35, 2); }
        }
        for (const e of enemies) {
          if (b.hit.has(e) || dist2(b.x, b.y, e.x, e.y) > (b.r + e.r) ** 2) continue;

            if (dot < 0) { b.vx -= 2 * dot * nx; b.vy -= 2 * dot * ny; }
            b.x = e.x + nx * (e.r + b.r + 1); b.y = e.y + ny * (e.r + b.r + 1);
            b.b++; b.pow++; b.hit.add(e); E.burst(b.x, b.y, 8, e.T.col, 200, 0.3, 2); E.sfx('hit');
            if (b.b > up.bounce) dead = true; break;
          }
          if (e.T.ghost && b.b === 0) { b.hit.add(e); E.spray(e.x, e.y, rand(TAU), 3, 4, e.T.col, 100, 0.3, 2); continue; }
          b.hit.add(e); e.hp -= Math.pow(2, b.pow); e.flash = 0.08; e.kx += b.vx * 0.3; e.ky += b.vy * 0.3; E.sfx('hit');
          if (e.hp <= 0) kill(e, b);

      }
      b.trail.push({ x: b.x, y: b.y }); if (b.trail.length > 10) b.trail.shift();

      const a = angTo(e.x, e.y, P.x, P.y), d = dist(e.x, e.y, P.x, P.y);
      if (e.T.spin) e.face += e.T.spin * dt; else e.face += clamp(angDiff(e.face, a), -2.2 * dt, 2.2 * dt);
      let mx = Math.cos(a), my = Math.sin(a), sp = e.T.spd * (1 + room * 0.03);
      if (e.type === 'warlock' && d < 260) { mx = -mx; my = -my; }
      if (e.type === 'hound') { const w = Math.sin(e.t * 5) * 0.7; [mx, my] = [mx * Math.cos(w) - my * Math.sin(w), mx * Math.sin(w) + my * Math.cos(w)]; }

      pushOut(e);
      if (e.type === 'bastion' || e.type === 'warlock') {
        e.fire -= dt;
        if (e.fire <= 0) {
          if (e.type === 'bastion') { e.fire = 2.2; for (let k = 0; k < 6; k++) { const aa = e.face + Math.PI + (k - 2.5) * 0.35; ebul.push({ x: e.x, y: e.y, vx: Math.cos(aa) * 170, vy: Math.sin(aa) * 170, r: 6, b: 1 }); } }
          else { e.fire = 1.8; ebul.push({ x: e.x, y: e.y, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 7, b: 1 }); }
          E.sfx('zap');
        }
      }
      if (dist2(e.x, e.y, P.x, P.y) < (e.r + P.r - 3) ** 2) { hurt(); e.kx -= Math.cos(a) * 300; e.ky -= Math.sin(a) * 300; }
    }

      const b = ebul[i]; b.x += b.vx * dt; b.y += b.vy * dt;

      if (dist2(b.x, b.y, P.x, P.y) < (P.r + b.r - 2) ** 2) { ebul.splice(i, 1); hurt(); }

  }

  function draw(c) {

    c.strokeStyle = 'rgba(122,255,209,0.05)'; c.lineWidth = 1;

      c.fillStyle = '#26301d'; c.fillRect(p.x, p.y, p.w, p.h);

      for (let i = 0; i < preview.length - 1; i++) { c.strokeStyle = E.hexA(POW_COLS[Math.min(5, i + up.startPow)], 0.5 - i * 0.12); c.beginPath(); c.moveTo(preview[i].x, preview[i].y); c.lineTo(preview[i + 1].x, preview[i + 1].y); c.stroke(); }
      c.setLineDash([]);
    }
    for (const e of enemies) {
      c.save(); c.translate(e.x, e.y); E.drawGlow(c, 0, 0, e.T.col, e.r * 2.2, 0.4);
      c.globalAlpha = e.T.ghost ? 0.55 + 0.25 * Math.sin(E.t * 5) : 1;
      c.fillStyle = e.flash > 0 ? '#fff' : e.T.col;
      if (e.type === 'hound') { c.rotate(angTo(e.x, e.y, P.x, P.y)); c.beginPath(); c.moveTo(e.r + 5, 0); c.lineTo(-e.r, e.r); c.lineTo(-e.r, -e.r); c.closePath(); c.fill(); }
      else if (e.type === 'ghost') { c.beginPath(); c.arc(0, -2, e.r, Math.PI, 0); for (let k = 0; k <= 4; k++) c.lineTo(e.r - k * e.r / 2, e.r + (k % 2 ? -4 : 2)); c.closePath(); c.fill(); }
      else if (e.type === 'bastion') { c.fillRect(-e.r * 0.7, -e.r * 0.7, e.r * 1.4, e.r * 1.4); }
      else { c.beginPath(); c.arc(0, 0, e.r, 0, TAU); c.fill(); }

      if (e.T.shield) { c.strokeStyle = '#fff'; c.lineWidth = 5; c.shadowColor = e.T.col; c.shadowBlur = 10; c.beginPath(); c.arc(0, 0, e.r + 6, e.face - e.T.shield / 2, e.face + e.T.shield / 2); c.stroke(); c.shadowBlur = 0; }
      c.fillStyle = '#000'; const fa = e.T.spin ? e.face + Math.PI : angTo(e.x, e.y, P.x, P.y); c.beginPath(); c.arc(Math.cos(fa) * e.r * 0.4, Math.sin(fa) * e.r * 0.4, 3, 0, TAU); c.fill();

      c.strokeStyle = col; c.lineCap = 'round'; c.lineWidth = b.r; c.globalAlpha = 0.5; c.beginPath(); b.trail.forEach((t, i) => i ? c.lineTo(t.x, t.y) : c.moveTo(t.x, t.y)); c.stroke(); c.globalAlpha = 1;
      E.drawGlow(c, b.x, b.y, col, b.r * 3.2); c.fillStyle = '#fff'; c.beginPath(); c.arc(b.x, b.y, b.r * 0.6, 0, TAU); c.fill();

    }
  }
  function hud(c) {

    for (let i = 0; i < P.maxHp; i++) { c.fillStyle = i < P.hp ? C.b : 'rgba(255,255,255,0.15)'; c.save(); c.translate(50 + i * 24, 15); c.rotate(Math.PI / 4); c.fillRect(-6, -6, 12, 12); c.restore(); }
    E.txt(c, score.toLocaleString(), W / 2, 15, 22, '#fff');
    E.txt(c, 'ROOM ' + room, W - 90, 15, 16, C.c, 'right');
    E.txt(c, 'BOLTS', 200, 15, 14, '#fff', 'right'); for (let i = 0; i < up.ammo; i++) { c.fillStyle = i < P.ammo ? '#fff' : 'rgba(255,255,255,0.2)'; c.fillRect(210 + i * 16, 9, 10, 12); }
    if (bannerT > 0 && E.state === 'play') { c.globalAlpha = clamp(bannerT, 0, 1); E.txt(c, 'ROOM ' + room, W / 2, H / 2 - 130, 60, C.b, 'center', 20); if (room === 1) E.txt(c, 'Shields face you — bank your shots', W / 2, H / 2 - 80, 22, '#fff'); c.globalAlpha = 1; }
  }
  function overlay(c) {

    modal.choice.forEach((u, i) => { const x = W / 2 + (i - 1) * 330; if (E.btn(c, x, 360, 300, 200, u.name, { size: 28, sub: u.desc, color: C.b }) && modal.t > 0.35) take(u); });

  window.__stress = () => { P.hp = P.maxHp = 999; for (let r = 0; r < 8; r++) { for (let i = 0; i < 300; i++) { update(1 / 60); if (i % 10 === 0) { P.ammo = 3; fire(rand(TAU)); } } enemies.length = 0; toSpawn.length = 0; spawns.length = 0; modal = null; startRoom(); } return { room }; };
  return {
    id: 'caromancer', name: 'Caromancer', tagline: 'Every bounce makes the bolt stronger. Bank it.',
    colors: C, actionLabel: null,
    controls: ['WASD / Arrows — move     Mouse — aim (the guide shows your bounce)', 'Click / Space — fire a bolt (3 charges, auto-reload)', 'Each bounce doubles damage  •  shields face you, so ricochet around them'],
    touchControls: ['Left thumb — move', 'Right thumb — drag to aim, lift to fire', 'Each bounce doubles damage  •  ricochet around shields'],
    musicCfg: { bpm: 120, root: 110, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 5, 3, 4], arp: [0, 2, 4, 6, 4, 2, 0, 4], leadType: 'square' },
    reset, update, draw, hud, overlay, modal: () => !!modal, hideTouch: () => !!modal, touchBlock: () => !!modal,
    autoAim: () => { let b = null, bd = 1e9; for (const e of enemies) { const d = dist2(e.x, e.y, P.x, P.y); if (d < bd) { bd = d; b = e; } } return b ? angTo(P.x, P.y, b.x, b.y) : null; },
    pauseInfo: () => [`Room ${room}  •  ${kills} foes  •  best carom ${bestCarom}`],
  };
})();
const GAMEDEF = CR;

E.boot(GAMEDEF);
</script></body></html>
